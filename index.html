<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Andi Raman</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.4);
        }

        .avatar svg {
            width: 45px;
            height: 45px;
            fill: white;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin-bottom: 35px;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            color: white;
            font-size: 13px;
            margin-bottom: 8px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper svg {
            position: absolute;
            left: 15px;
            width: 20px;
            height: 20px;
            fill: rgba(255, 255, 255, 0.7);
            transition: fill 0.3s;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .input-group input:focus {
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .input-group input:focus + svg,
        .input-wrapper:focus-within svg {
            fill: white;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
        }

        .remember input {
            margin-right: 7px;
            accent-color: #f5576c;
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        .forgot {
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            cursor: pointer;
            border-bottom: 1px solid transparent;
        }

        .forgot:hover {
            border-bottom: 1px solid white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.4);
            text-transform: uppercase;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(245, 87, 108, 0.6);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* Modal Lupa Sandi */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 20px;
            padding: 35px 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal h2 {
            color: #333;
            font-size: 22px;
            margin-bottom: 10px;
            text-align: center;
        }

        .modal p {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .modal-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .modal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: white;
        }

        .modal-btn.gmail {
            background: linear-gradient(135deg, #EA4335, #c5221f);
            box-shadow: 0 8px 20px rgba(234, 67, 53, 0.3);
        }

        .modal-btn.wa {
            background: linear-gradient(135deg, #25D366, #128C7E);
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
        }

        .modal-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .modal-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .btn-close {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 12px;
            background: white;
            color: #666;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-close:hover {
            background: #f5f5f5;
            border-color: #ddd;
        }

        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: white;
            color: #333;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            font-size: 14px;
            font-weight: 600;
            z-index: 2000;
            transition: transform 0.4s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.success { border-left: 5px solid #25D366; }
        .toast.error { border-left: 5px solid #EA4335; }

        @media (max-width: 480px) {
            .login-container { padding: 35px 25px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="avatar">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>
        <h1>Selamat Datang</h1>
        <p class="subtitle">Silakan login untuk melanjutkan</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="Masukkan username" required>
                    <svg viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Masukkan password" required>
                    <svg viewBox="0 0 24 24">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                    </svg>
                </div>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox"> Ingat saya
                </label>
                <a class="forgot" onclick="openModal()">Lupa Sandi?</a>
            </div>

            <button type="submit" class="btn-login">Login</button>
        </form>
    </div>

    <!-- Modal Lupa Sandi -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>🔐 Lupa Sandi?</h2>
            <p>Pilih metode untuk menerima link reset sandi Anda. Sandi akan dikirim ke kontak yang terdaftar.</p>

            <div class="modal-options">
                <a href="#" class="modal-btn gmail" onclick="kirimGmail(event)">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                    </svg>
                    Kirim via Gmail
                </a>
                <a href="#" class="modal-btn wa" onclick="kirimWA(event)">
                    <svg viewBox="0 0 24 24">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                    </svg>
                    Kirim via WhatsApp
                </a>
            </div>

            <button class="btn-close" onclick="closeModal()">Batal</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script>
        // Data akun (bisa diganti sesuai kebutuhan)
        const USER_DATA = {
            username: "andiraman",
            password: "rahasia123",
            email: "andiramanbs07@gmail.com",
            wa: "6287843842374" // format internasional tanpa +
        };

        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        // Tutup modal jika klik di luar
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        function kirimGmail(e) {
            e.preventDefault();
            
            const subject = encodeURIComponent("Reset Sandi Akun Anda");
            const body = encodeURIComponent(
                "Halo,\n\n" +
                "Kami menerima permintaan reset sandi untuk akun Anda.\n\n" +
                "Detail Akun:\n" +
                "━━━━━━━━━━━━━━━━━━\n" +
                "Username : " + USER_DATA.username + "\n" +
                "Password : " + USER_DATA.password + "\n" +
                "━━━━━━━━━━━━━━━━━━\n\n" +
                "Silakan login kembali dan segera ganti sandi Anda demi keamanan.\n\n" +
                "Terima kasih,\n" +
                "Tim Keamanan Akun"
            );

            const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${USER_DATA.email}&su=${subject}&body=${body}`;
            
            window.open(gmailUrl, '_blank');
            showToast('✅ Membuka Gmail untuk mengirim sandi...', 'success');
            closeModal();
        }

        function kirimWA(e) {
            e.preventDefault();
            
            const message = encodeURIComponent(
                "🔐 *RESET SANDI AKUN* 🔐\n\n" +
                "Halo,\n\n" +
                "Berikut detail akun Anda:\n" +
                "━━━━━━━━━━━━━━━\n" +
                "👤 Username : " + USER_DATA.username + "\n" +
                "🔑 Password : " + USER_DATA.password + "\n" +
                "━━━━━━━━━━━━━━━\n\n" +
                "⚠️ Jangan bagikan data ini kepada siapa pun.\n" +
                "Segera ganti sandi Anda setelah login.\n\n" +
                "Terima kasih 🙏"
            );

            const waUrl = `https://wa.me/${USER_DATA.wa}?text=${message}`;
            
            window.open(waUrl, '_blank');
            showToast('✅ Membuka WhatsApp untuk mengirim sandi...', 'success');
            closeModal();
        }

        function handleLogin(e) {
    e.preventDefault();
    
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    if (username === USER_DATA.username && password === USER_DATA.password) {
        showToast('🎉 Login berhasil! Mengalihkan...', 'success');
        
        // ⭐ SIMPAN USERNAME KE LOCALSTORAGE
        localStorage.setItem('username', username);
        
        // ⭐ REDIRECT KE BERANDA SETELAH 1 DETIK
        setTimeout(() => {
            window.location.href = 'beranda.html'; // nama file beranda Anda
        }, 1000);
        
    } else {
        showToast('❌ Username atau password salah!', 'error');
    }
}
