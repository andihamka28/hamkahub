<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            background-size: 400% 400%;
            animation: bg 15s ease infinite;
        }
        @keyframes bg {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .box {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 50px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.3);
        }
        h1 { color: white; text-align: center; margin-bottom: 8px; font-size: 28px; }
        .subtitle { color: rgba(255,255,255,0.8); text-align: center; margin-bottom: 30px; font-size: 14px; }
        label { color: white; font-size: 13px; display: block; margin-bottom: 8px; font-weight: 500; }
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 15px;
            outline: none;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        input::placeholder { color: rgba(255,255,255,0.6); }
        input:focus { border-color: white; background: rgba(255,255,255,0.2); }
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(245,87,108,0.5); }
        .info { color: rgba(255,255,255,0.7); font-size: 12px; text-align: center; margin-top: 20px; }
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.4s;
            z-index: 9999;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { border-left: 5px solid #25D366; }
        .toast.error { border-left: 5px solid #EA4335; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔐 Login</h1>
        <p class="subtitle">Masukkan email & password Anda</p>
        
        <form id="formLogin">
            <label>Email</label>
            <input type="email" id="email" placeholder="contoh@email.com" required>
            
            <label>Password</label>
            <input type="password" id="password" placeholder="Masukkan password" required>
            
            <button type="submit">Masuk</button>
        </form>
        
        <p class="info">Gunakan akun yang sudah dibuat di Firebase</p>
    </div>
    
    <div class="toast" id="toast"></div>

    <script type="module">
        import { loginUser } from './auth.js';
        
        const toast = document.getElementById('toast');
        
        function showToast(msg, type) {
            toast.textContent = msg;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            
            showToast('⏳ Memproses...', 'success');
            
            const hasil = await loginUser(email, password);
            
            if (hasil.success) {
                showToast('🎉 Login berhasil!', 'success');
                localStorage.setItem('isLoggedIn', 'true');
                setTimeout(() => {
                    window.location.href = 'beranda.html';
                }, 1000);
            } else {
                showToast('❌ ' + hasil.message, 'error');
            }
        });
    </script>
</body>
</html>
