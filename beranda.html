
    <script type="module">
        import { 
            db, collection, addDoc, getDocs, doc, 
            updateDoc, deleteDoc, query, orderBy, where, serverTimestamp 
        } from './firebase.js';

        if (localStorage.getItem('isLoggedIn') !== 'true') {
            alert('Anda harus login dulu!');
            window.location.href = 'index.html';
        }

        const username = localStorage.getItem('username') || 'User';
        document.getElementById('userName').textContent = username;
        document.getElementById('userAvatar').textContent = username.substring(0,2).toUpperCase();

        const now = new Date();
        const jam = now.getHours();
        let sapaan = 'Selamat Pagi';
        let heroGreet = 'SELAMAT PAGI';
        if (jam >= 11 && jam < 15) { sapaan = 'Selamat Siang'; heroGreet = 'SELAMAT SIANG'; }
        else if (jam >= 15 && jam < 18) { sapaan = 'Selamat Sore'; heroGreet = 'SELAMAT SORE'; }
        else if (jam >= 18) { sapaan = 'Selamat Malam'; heroGreet = 'SELAMAT MALAM'; }
        
        document.getElementById('greeting').textContent = `Hai, ${username}! 👋`;
        document.getElementById('heroGreeting').textContent = heroGreet;
        const opsi = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
        const opsiFull = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
        document.getElementById('currentDate').textContent = now.toLocaleDateString('id-ID', opsi);
        document.getElementById('currentDateFull').textContent = now.toLocaleDateString('id-ID', opsiFull);

        const MENU_CONFIG = {

                tabs: null,

            },
            target: {
                title: "🎯 Target & Habit",

                tabs: [
                    { id: 'target', label: '🎯 Target' },

                fieldsPerTab: {
                    target: [
                        { name: "judul", label: "Nama Target", type: "text", required: true },
                        { name: "deskripsi", label: "Deskripsi", type: "textarea", required: false },
                        { name: "deadline", label: "Deadline", type: "date", required: true },

                    ],
                    habit: [

                    ]
                }
            },
            agenda: {
                title: "📋 Agenda & To-Do",
                collection: "agenda_todo",
                tabs: [
                    { id: 'agenda', label: '📋 Agenda' },
                    { id: 'todo', label: '✔️ To-Do' },
                    { id: 'deadline', label: '⏰ Deadline' }
                ],
                fieldsPerTab: {
                    agenda: [
                        { name: "judul", label: "Judul Agenda", type: "text", required: true },
                        { name: "tanggal", label: "Tanggal", type: "date", required: true },
                        { name: "waktu", label: "Waktu", type: "time", required: false },
                        { name: "lokasi", label: "Lokasi", type: "text", required: false },
                        { name: "catatan", label: "Catatan", type: "textarea", required: false }
                    ],
                    todo: [
                        { name: "tugas", label: "Nama Tugas", type: "text", required: true },
                        { name: "prioritas", label: "Prioritas", type: "select", options: ["Rendah", "Sedang", "Tinggi"], required: true },

                    ],
                    deadline: [

                        { name: "deadline", label: "Tanggal Deadline", type: "date", required: true },
                        { name: "keterangan", label: "Keterangan", type: "textarea", required: false }
                    ]
                }
            },
            pengingat: {
                title: "🔔 Pengingat",
                collection: "pengingat",
                tabs: null,
                fields: [
                    { name: "judul", label: "Judul Pengingat", type: "text", required: true },
                    { name: "waktu", label: "Waktu", type: "datetime-local", required: true },
                    { name: "catatan", label: "Catatan", type: "textarea", required: false }
                ]
            },
            pekerjaan: {
                title: "💼 Pekerjaan",
                collection: "pekerjaan",
                tabs: [
                    { id: 'pekerjaan', label: '💼 Pekerjaan' },
                    { id: 'tugas', label: '📌 Tugas' },
                    { id: 'proyek', label: '🚀 Proyek' }
                ],
                fieldsPerTab: {
                    pekerjaan: [
                        { name: "judul", label: "Nama Pekerjaan", type: "text", required: true },
                        { name: "deskripsi", label: "Deskripsi", type: "textarea", required: false },
                        { name: "status", label: "Status", type: "select", options: ["Belum Mulai", "Proses", "Selesai"], required: true }
                    ],
                    tugas: [
                        { name: "judul", label: "Nama Tugas", type: "text", required: true },
                        { name: "deadline", label: "Deadline", type: "date", required: true },
                        { name: "prioritas", label: "Prioritas", type: "select", options: ["Rendah", "Sedang", "Tinggi"], required: true },
                        { name: "status", label: "Status", type: "select", options: ["Belum", "Proses", "Selesai"], required: true }
                    ],
                    proyek: [
                        { name: "nama", label: "Nama Proyek", type: "text", required: true },
                        { name: "deskripsi", label: "Deskripsi", type: "textarea", required: false },
                        { name: "mulai", label: "Tanggal Mulai", type: "date", required: true },
                        { name: "selesai", label: "Target Selesai", type: "date", required: true },
                        { name: "progress", label: "Progress (%)", type: "number", required: false }
                    ]
                }
            },
            link: {
                title: "⭐ Link Penting",
                collection: "link",
                tabs: null,
                fields: [
                    { name: "nama", label: "Nama Link", type: "text", required: true },
                    { name: "url", label: "URL", type: "url", required: true },
                    { name: "kategori", label: "Kategori", type: "text", required: false },
                    { name: "catatan", label: "Catatan", type: "textarea", required: false }
                ]
            },
            arsip: {
                title: "🗃️ Arsip",
                collection: "arsip",
                tabs: null,
                fields: [
                    { name: "judul", label: "Judul Arsip", type: "text", required: true },
                    { name: "kategori", label: "Kategori", type: "select", options: ["Agenda", "Tugas", "Catatan", "Pekerjaan", "Keuangan", "Lainnya"], required: true },
                    { name: "keterangan", label: "Keterangan", type: "textarea", required: false }
                ]
            }
        };

        let currentMenu = null;
        let currentTab = null;
        let editId = null;

        // STATE HARI AKTIF
        let hariAktif = null;
        const HARI_URUT = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

        function getHariIni() {
            return HARI_URUT[new Date().getDay()];
        }

        const toast = document.getElementById('toast');
        window.showToast = function(msg, type = 'success') {
            toast.textContent = msg;
            toast.className = 'toast ' + type + ' show';
            clearTimeout(window._t);
            window._t = setTimeout(() => toast.classList.remove('show'), 2500);
        };

        window.toggleSidebar = function() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        };

        window.bukaHalaman = async function(namaMenu, el) {
            try {
                if (el) {
                    document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
                    el.classList.add('active');
                }
                document.querySelectorAll('.page-menu').forEach(p => p.classList.remove('active'));

                if (namaMenu === 'dashboard') {
                    document.getElementById('page-dashboard').classList.add('active');
                    document.getElementById('pageTitle').textContent = 'Dashboard';
                    await loadStatistik();
                    return;
                }

                currentMenu = namaMenu;
                document.getElementById('page-menu').classList.add('active');

                document.getElementById('menuNormal').style.display = 'none';
                document.getElementById('menuKeuangan').style.display = 'none';

                const tombolTambah = document.querySelector('.page-header .btn-tambah');
                if (tombolTambah) tombolTambah.style.display = 'block';

                if (namaMenu === 'keuangan') {
                    document.getElementById('pageTitle').textContent = '💰 Keuangan';
                    document.getElementById('menuKeuangan').style.display = 'block';
                    const today = new Date().toISOString().slice(0, 7);
                    const filterBulan = document.getElementById('filterBulanKeuangan');
                    if (!filterBulan.value) filterBulan.value = today;
                    filterBulan.onchange = () => loadKeuangan();
                    await loadKeuangan();
                }
                else if (namaMenu === 'arsip') {
                    document.getElementById('pageTitle').textContent = '🗃️ Arsip (Otomatis)';
                    document.getElementById('menuNormal').style.display = 'block';
                    document.getElementById('menuTitle').textContent = '🗃️ Arsip Otomatis';
                    const tombol = document.querySelector('.page-header .btn-tambah');
                    if (tombol) tombol.style.display = 'none';
                    document.getElementById('menuTabs').style.display = 'none';
                    await tampilkanArsip();
                }
                else if (namaMenu === 'daily') {
                    document.getElementById('pageTitle').textContent = '⏰ Daily Scheduling';
                    document.getElementById('menuNormal').style.display = 'block';
                    document.getElementById('menuTitle').textContent = '⏰ Daily Scheduling';

                    hariAktif = getHariIni();

                    const tabsEl = document.getElementById('menuTabs');
                    tabsEl.style.display = 'flex';
                    tabsEl.innerHTML = '';
                    
                    const tabConfig = [
                        { id: 'mingguan', label: '📅 Mingguan' },
                        { id: 'pelajaran', label: '📚 Pelajaran' }
                    ];
                    
                    tabConfig.forEach((tab, i) => {
                        const btn = document.createElement('button');
                        btn.className = 'tab' + (i === 0 ? ' active' : '');
                        btn.textContent = tab.label;
                        btn.onclick = () => {
                            tabsEl.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                            btn.classList.add('active');
                            currentTab = tab.id;
                            tampilkanDaily(tab.id);
                        };
                        tabsEl.appendChild(btn);
                    });
                    
                    currentTab = 'mingguan';
                    await tampilkanDaily('mingguan');
                }
                else {
                    const config = MENU_CONFIG[namaMenu];
                    if (!config) {
                        showToast('⚠️ Menu belum tersedia', 'error');
                        return;
                    }
                    document.getElementById('pageTitle').textContent = config.title;
                    document.getElementById('menuNormal').style.display = 'block';
                    document.getElementById('menuTitle').textContent = config.title;

                    const tabsEl = document.getElementById('menuTabs');
                    if (config.tabs) {
                        tabsEl.style.display = 'flex';
                        tabsEl.innerHTML = '';
                        config.tabs.forEach((tab, i) => {
                            const btn = document.createElement('button');
                            btn.className = 'tab' + (i === 0 ? ' active' : '');
                            btn.textContent = tab.label;
                            btn.onclick = () => {
                                tabsEl.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                                btn.classList.add('active');
                                currentTab = tab.id;
                                tampilkanData(config.collection, tab.id);
                            };
                            tabsEl.appendChild(btn);
                        });
                        currentTab = config.tabs[0].id;
                        await tampilkanData(config.collection, currentTab);
                    } else {
                        tabsEl.style.display = 'none';
                        currentTab = null;
                        await tampilkanData(config.collection, null);
                    }
                }

                if (window.innerWidth <= 900) {
                    document.getElementById('sidebar').classList.remove('active');
                    document.getElementById('overlay').classList.remove('active');
                }
            } catch (error) {
                console.error('Error bukaHalaman:', error);
                showToast('❌ Error: ' + error.message, 'error');
            }
        };

        // ⭐ NAVIGASI HARI
        window.pindahHari = function(arah) {
            const idx = HARI_URUT.indexOf(hariAktif);
            let newIdx;
            if (arah === 'next') newIdx = (idx + 1) % HARI_URUT.length;
            else newIdx = (idx - 1 + HARI_URUT.length) % HARI_URUT.length;
            hariAktif = HARI_URUT[newIdx];
            tampilkanDaily(currentTab);
        };

        window.kembaliHariIni = function() {
            hariAktif = getHariIni();
            tampilkanDaily(currentTab);
        };

        function getTanggalUntukHari(hari) {
            const hariIni = getHariIni();
            const idxHariIni = HARI_URUT.indexOf(hariIni);
            const idxTarget = HARI_URUT.indexOf(hari);
            const selisih = idxTarget - idxHariIni;
            
            const now = new Date();
            const targetDate = new Date(now);
            targetDate.setDate(now.getDate() + selisih);
            
            const opsi = { day: 'numeric', month: 'long', year: 'numeric' };
            return targetDate.toLocaleDateString('id-ID', opsi);
        }

        function renderNavigasiHari(listData) {
            const hariIni = getHariIni();
            const isHariIni = hariAktif === hariIni;
            const hariClass = 'hari-' + hariAktif.toLowerCase();
            
            const nav = document.createElement('div');
            nav.className = 'nav-hari';
            nav.innerHTML = `
                <div class="nav-hari-info">
                    <div class="nav-hari-icon ${hariClass}">📅</div>
                    <div class="nav-hari-text">
                        <h3>${hariAktif} ${isHariIni ? '<span class="badge-hari-ini">HARI INI</span>' : ''}</h3>
                        <p id="nav-hari-tanggal">Memuat tanggal...</p>
                    </div>
                </div>
                <div class="nav-hari-controls">
                    <button class="btn-nav-hari" onclick="pindahHari('prev')" title="Hari sebelumnya">◀</button>
                    <button class="btn-nav-today ${isHariIni ? 'disabled' : ''}" onclick="kembaliHariIni()" ${isHariIni ? 'disabled' : ''}>Hari Ini</button>
                    <button class="btn-nav-hari" onclick="pindahHari('next')" title="Hari berikutnya">▶</button>
                </div>
            `;
            listData.appendChild(nav);

            setTimeout(() => {
                const el = document.getElementById('nav-hari-tanggal');
                if (el) el.textContent = getTanggalUntukHari(hariAktif);
            }, 50);
        }

        // ⭐ TAMPILKAN DAILY - PER HARI
        async function tampilkanDaily(tabDaily) {
            const listData = document.getElementById('listData');
            listData.innerHTML = '<div class="empty-state"><div class="icon-big">⏳</div>Memuat data...</div>';

            if (!hariAktif) hariAktif = getHariIni();

            try {
                const hariClass = 'hari-' + hariAktif.toLowerCase();
                
                if (tabDaily === 'mingguan') {
                    const snapshot = await getDocs(collection(db, 'daily_mingguan'));
                    const items = [];
                    snapshot.forEach(docSnap => {
                        const data = docSnap.data();
                        if (data.hari === hariAktif) items.push({ id: docSnap.id, ...data });
                    });
                    items.sort((a, b) => (a.jam_mulai || '').localeCompare(b.jam_mulai || ''));

                    listData.innerHTML = '';
                    renderNavigasiHari(listData);

                    if (items.length === 0) {
                        const empty = document.createElement('div');
                        empty.className = 'empty-state';
                        empty.innerHTML = `
                            <div class="icon-big">📭</div>
                            <p>Belum ada jadwal untuk <strong>${hariAktif}</strong>.</p>
                            <p style="margin-top:8px;font-size:13px;color:#a0aec0;">Klik <strong>"+ Tambah"</strong> untuk membuat jadwal.</p>
                        `;
                        listData.appendChild(empty);
                        return;
                    }

                    const wrap = document.createElement('div');
                    wrap.className = 'sched-list-keren';

                    items.forEach(data => {
                        const id = data.id;
                        const item = document.createElement('div');
                        item.className = `sched-item-keren ${hariClass}`;
                        
                        const jamMulai = data.jam_mulai || '-';
                        const jamSelesai = data.jam_selesai || '';
                        
                        item.innerHTML = `
                            <div class="sched-jam-keren ${hariClass}">
                                <div class="sched-jam-label">Mulai</div>
                                <div class="sched-jam-mulai">${jamMulai}</div>
                                ${jamSelesai ? `
                                    <div class="sched-jam-divider"></div>
                                    <div class="sched-jam-selesai">s/d ${jamSelesai}</div>
                                ` : ''}
                            </div>
                            <div class="sched-konten-keren">
                                <div class="sched-judul-keren">📌 ${escapeHtml(data.kegiatan || '-')}</div>
                                <div class="sched-meta-keren">
                                    ${data.lokasi ? `<span>📍 ${escapeHtml(data.lokasi)}</span>` : ''}
                                </div>
                                ${data.catatan ? `<div class="sched-catatan-keren">📝 ${escapeHtml(data.catatan)}</div>` : ''}
                            </div>
                            <div class="sched-actions-keren">
                                <button class="btn-icon btn-edit" title="Edit">✏️</button>
                                <button class="btn-icon btn-hapus" title="Hapus">🗑️</button>
                            </div>
                        `;
                        item.querySelector('.btn-edit').onclick = () => editDaily(id, data, 'mingguan');
                        item.querySelector('.btn-hapus').onclick = async () => {
                            if (confirm('Hapus jadwal ini?')) {
                                await deleteDoc(doc(db, 'daily_mingguan', id));
                                showToast('🗑️ Jadwal dihapus!');
                                await tampilkanDaily('mingguan');
                            }
                        };
                        wrap.appendChild(item);
                    });

                    listData.appendChild(wrap);
                    return;
                }

                if (tabDaily === 'pelajaran') {
                    const snapshot = await getDocs(collection(db, 'pelajaran'));
                    const items = [];
                    snapshot.forEach(docSnap => {
                        const data = docSnap.data();
                        if (data.hari === hariAktif) items.push({ id: docSnap.id, ...data });
                    });
                    items.sort((a, b) => (a.jam_mulai || '').localeCompare(b.jam_mulai || ''));

                    listData.innerHTML = '';
                    renderNavigasiHari(listData);

                    if (items.length === 0) {
                        const empty = document.createElement('div');
                        empty.className = 'empty-state';
                        empty.innerHTML = `
                            <div class="icon-big">📭</div>
                            <p>Belum ada mata pelajaran untuk <strong>${hariAktif}</strong>.</p>
                            <p style="margin-top:8px;font-size:13px;color:#a0aec0;">Klik <strong>"+ Tambah"</strong> untuk membuat jadwal.</p>
                        `;
                        listData.appendChild(empty);
                        return;
                    }

                    const wrap = document.createElement('div');
                    wrap.className = 'sched-list-keren';

                    items.forEach(data => {
                        const id = data.id;
                        const item = document.createElement('div');
                        item.className = `sched-item-keren ${hariClass}`;
                        
                        const jamMulai = data.jam_mulai || '-';
                        const jamSelesai = data.jam_selesai || '';
                        
                        item.innerHTML = `
                            <div class="sched-jam-keren ${hariClass}">
                                <div class="sched-jam-label">Jam</div>
                                <div class="sched-jam-mulai">${jamMulai}</div>
                                ${jamSelesai ? `
                                    <div class="sched-jam-divider"></div>
                                    <div class="sched-jam-selesai">s/d ${jamSelesai}</div>
                                ` : ''}
                            </div>
                            <div class="sched-konten-keren">
                                <div class="sched-judul-keren">📚 ${escapeHtml(data.mapel || '-')}</div>
                                <div class="sched-meta-keren">
                                    ${data.guru ? `<span>👨‍🏫 ${escapeHtml(data.guru)}</span>` : ''}
                                    ${data.ruang ? `<span>🏫 ${escapeHtml(data.ruang)}</span>` : ''}
                                </div>
                                ${data.catatan ? `<div class="sched-catatan-keren">📝 ${escapeHtml(data.catatan)}</div>` : ''}
                            </div>
                            <div class="sched-actions-keren">
                                <button class="btn-icon btn-edit" title="Edit">✏️</button>
                                <button class="btn-icon btn-hapus" title="Hapus">🗑️</button>
                            </div>
                        `;
                        item.querySelector('.btn-edit').onclick = () => editDaily(id, data, 'pelajaran');
                        item.querySelector('.btn-hapus').onclick = async () => {
                            if (confirm('Hapus mata pelajaran ini?')) {
                                await deleteDoc(doc(db, 'pelajaran', id));
                                showToast('🗑️ Mapel dihapus!');
                                await tampilkanDaily('pelajaran');
                            }
                        };
                        wrap.appendChild(item);
                    });

                    listData.appendChild(wrap);
                    return;
                }
            } catch (error) {
                console.error('Error:', error);
                listData.innerHTML = `<div class="empty-state"><div class="icon-big">❌</div><p>Gagal memuat: ${error.message}</p></div>`;
            }
        }

        // ⭐ TAMPILKAN DATA UMUM
        async function tampilkanData(koleksi, tab) {
            const listData = document.getElementById('listData');
            listData.innerHTML = '<div class="empty-state"><div class="icon-big">⏳</div>Memuat data...</div>';

            try {
                const snapshot = await getDocs(collection(db, koleksi));

                if (snapshot.empty) {
                    listData.innerHTML = `
                        <div class="empty-state">
                            <div class="icon-big">📭</div>
                            <p>Belum ada data. Klik tombol <strong>"+ Tambah"</strong> untuk membuat.</p>
                        </div>`;
                    return;
                }

                let items = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (tab && data.jenis !== tab) return;
                    items.push({ id: docSnap.id, ...data });
                });

                items.sort((a, b) => {
                    const ta = a.createdAt?.seconds || 0;
                    const tb = b.createdAt?.seconds || 0;
                    return tb - ta;
                });

                if (items.length === 0) {
                    listData.innerHTML = `
                        <div class="empty-state">
                            <div class="icon-big">📭</div>
                            <p>Belum ada data di tab ini. Klik <strong>"+ Tambah"</strong> untuk membuat.</p>
                        </div>`;
                    return;
                }

                listData.innerHTML = '';

                if (tab === 'habit') {
                    items.forEach(data => {
                        const id = data.id;
                        const progress = Number(data.progress) || 0;
                        const progressClass = progress >= 80 ? 'high' : progress >= 50 ? 'medium' : progress >= 20 ? '' : 'low';
                        const statusText = progress >= 100 ? '✅ Selesai!' : progress >= 80 ? '🔥 Hampir Selesai' : progress >= 50 ? '💪 Setengah Jalan' : progress >= 20 ? '👍 Mulai Jalan' : '🌱 Baru Mulai';

                        const card = document.createElement('div');
                        card.className = 'habit-card';
                        card.innerHTML = `
                            <div class="habit-header">
                                <h4>${escapeHtml(data.kebiasaan || 'Tanpa Nama')}</h4>
                                <button class="btn-icon btn-hapus" title="Hapus">🗑️</button>
                            </div>
                            <div class="habit-target">🎯 Target: ${escapeHtml(data.target_harian || '-')}</div>
                            <div class="progress-bar">
                                <div class="progress-fill ${progressClass}" style="width: ${progress}%"></div>
                            </div>
                            <div class="progress-text">
                                <span class="persen">${progress}%</span>
                                <span class="status">${statusText}</span>
                            </div>
                            <div class="habit-actions">
                                <button class="btn-progress tambah" data-action="+10">+10%</button>
                                <button class="btn-progress tambah" data-action="+20">+20%</button>
                                <button class="btn-progress kurang" data-action="-10">-10%</button>
                                <button class="btn-progress selesai" data-action="100">✅ 100%</button>
                                <button class="btn-progress reset" data-action="0">🔄 Reset</button>
                            </div>
                        `;
                        card.querySelector('.btn-hapus').onclick = async () => {
                            if (confirm('Hapus habit ini?')) {
                                await deleteDoc(doc(db, koleksi, id));
                                showToast('🗑️ Habit dihapus!');
                                await tampilkanData(koleksi, tab);
                            }
                        };
                        card.querySelectorAll('.btn-progress').forEach(btn => {
                            btn.onclick = async () => {
                                const action = btn.dataset.action;
                                let newProgress;
                                if (action === '100') newProgress = 100;
                                else if (action === '0') newProgress = 0;
                                else newProgress = Math.max(0, Math.min(100, progress + Number(action)));
                                await updateDoc(doc(db, koleksi, id), { progress: newProgress });
                                await tampilkanData(koleksi, tab);
                                if (newProgress === 100) showToast('🎉 Mantap! Habit tercapai 100%!');
                            };

                const pakaiCheckbox = (tab === 'todo' || tab === 'tugas');

                items.forEach(data => {
                    const id = data.id;
                    let title = data.judul || data.nama || data.keterangan || data.tugas || data.kebiasaan || 'Tanpa Judul';
                    
                    const infoItems = [];
                    if (data.tanggal) infoItems.push(`📅 ${data.tanggal}`);
                    if (data.waktu) infoItems.push(`🕐 ${data.waktu}`);
                    if (data.deadline) infoItems.push(`⏰ ${data.deadline}`);
                    if (data.status) infoItems.push(`📌 ${data.status}`);
                    if (data.prioritas) infoItems.push(`⚡ ${data.prioritas}`);
                    if (data.kategori) infoItems.push(`🏷️ ${data.kategori}`);
                    
                    const preview = infoItems.join(' • ');
                    let deskripsi = data.isi || data.deskripsi || data.catatan || data.kegiatan || '';
                    const isSelesai = data.selesai === true;

                    const item = document.createElement('div');
                    item.className = 'list-item' + (isSelesai ? ' selesai' : '');
                    const checkboxHTML = pakaiCheckbox ? `<div class="check-selesai ${isSelesai ? 'checked' : ''}" title="Tandai selesai">✓</div>` : '';

                    item.innerHTML = `

                            await updateDoc(doc(db, koleksi, id), { selesai: newSelesai });
                            await tampilkanData(koleksi, tab);
                            if (newSelesai) showToast('✅ Tugas ditandai selesai!');

                    const editBtn = item.querySelector('.btn-edit');
                    if (editBtn) editBtn.onclick = () => editData(id, data, koleksi);

                    item.querySelector('.btn-hapus').onclick = async () => {
                        if (confirm('Yakin ingin menghapus data ini?')) {

                            await tampilkanData(koleksi, tab);
                            await loadStatistik();

                    listData.appendChild(item);

        window.simpanData = async function(e) {
            e.preventDefault();
            if (!currentMenu) return;

            const formData = new FormData(e.target);
            const data = {};
            formData.forEach((value, key) => {
                if (key === 'jumlah') data[key] = value.replace(/\./g, '');
                else data[key] = value;
            });

            try {
                if (currentMenu === 'daily') {
                    if (currentTab === 'mingguan') {
                        if (editId) {
                            await updateDoc(doc(db, 'daily_mingguan', editId), {...data, updatedAt: serverTimestamp()});
                            showToast('✅ Jadwal diperbarui!');
                        } else {
                            await addDoc(collection(db, 'daily_mingguan'), {...data, createdAt: serverTimestamp()});
                            showToast('✅ Jadwal disimpan!');
                        }
                    } else if (currentTab === 'pelajaran') {
                        if (editId) {
                            await updateDoc(doc(db, 'pelajaran', editId), {...data, updatedAt: serverTimestamp()});
                            showToast('✅ Mapel diperbarui!');
                        } else {
                            await addDoc(collection(db, 'pelajaran'), {...data, createdAt: serverTimestamp()});
                            showToast('✅ Mapel disimpan!');
                        }
                    }
                    tutupModal();
                    await tampilkanDaily(currentTab);
                    return;
                }

                const config = MENU_CONFIG[currentMenu];
                if (currentTab) data.jenis = currentTab;

                if (editId) {
                    await updateDoc(doc(db, config.collection, editId), {...data, updatedAt: serverTimestamp()});
                    showToast('✅ Data berhasil diperbarui!');
                } else {
                    if (currentTab === 'habit') data.progress = Number(data.progress) || 0;
                    if (currentTab === 'todo' || currentTab === 'tugas') data.selesai = false;
                    await addDoc(collection(db, config.collection), {...data, createdAt: serverTimestamp()});
                    showToast('✅ Data berhasil disimpan!');
                }
                tutupModal();
                await tampilkanData(config.collection, currentTab);
                await loadStatistik();
            } catch (error) {
                console.error('Error:', error);
                showToast('❌ Gagal menyimpan: ' + error.message, 'error');
            }
        };

                    ).join('');

        async function tampilkanArsip() {
            const listData = document.getElementById('listData');
            listData.innerHTML = '<div class="empty-state"><div class="icon-big">⏳</div>Memuat arsip...</div>';

            try {
                const arsipItems = [];

                const snapAgenda = await getDocs(collection(db, 'agenda_todo'));
                const today = new Date().toISOString().slice(0, 10);
                snapAgenda.forEach(docSnap => {
                    const d = docSnap.data();
                    if (d.jenis === 'todo' && d.selesai === true) {
                        arsipItems.push({
                            id: docSnap.id, judul: d.tugas || 'Tanpa Judul',
                            kategori: 'To-Do', icon: '✔️',
                            deskripsi: d.prioritas ? `Prioritas: ${d.prioritas}` : '',
                            tanggal: d.createdAt?.seconds ? new Date(d.createdAt.seconds * 1000).toLocaleDateString('id-ID') : '-',
                            sumber: 'agenda_todo', warna: '#48bb78'
                        });
                    }
                    if (d.jenis === 'agenda' && d.tanggal && d.tanggal < today) {
                        arsipItems.push({
                            id: docSnap.id, judul: d.judul || 'Tanpa Judul',
                            kategori: 'Agenda', icon: '📋',
                            deskripsi: d.lokasi ? `Lokasi: ${d.lokasi}` : '',
                            tanggal: d.tanggal, sumber: 'agenda_todo', warna: '#667eea'
                        });
                    }
                });

                const snapKerja = await getDocs(collection(db, 'pekerjaan'));
                snapKerja.forEach(docSnap => {
                    const d = docSnap.data();
                    if (d.status === 'Selesai') {
                        const jenisLabel = d.jenis === 'tugas' ? 'Tugas' : d.jenis === 'proyek' ? 'Proyek' : 'Pekerjaan';
                        const icon = d.jenis === 'tugas' ? '📌' : d.jenis === 'proyek' ? '🚀' : '💼';
                        arsipItems.push({
                            id: docSnap.id, judul: d.judul || d.nama || 'Tanpa Judul',
                            kategori: jenisLabel, icon: icon,
                            deskripsi: d.deskripsi || '',
                            tanggal: d.deadline || d.selesai || '-',
                            sumber: 'pekerjaan', warna: '#4facfe'
                        });
                    }
                });

                const snapTarget = await getDocs(collection(db, 'target_habit'));
                snapTarget.forEach(docSnap => {
                    const d = docSnap.data();
                    if (d.jenis === 'target' && d.status === 'Selesai') {
                        arsipItems.push({
                            id: docSnap.id, judul: d.judul || 'Tanpa Judul',
                            kategori: 'Target', icon: '🎯',
                            deskripsi: d.deskripsi || '',
                            tanggal: d.deadline || '-',
                            sumber: 'target_habit', warna: '#43e97b'
                        });
                    }
                });

                const snapArsip = await getDocs(collection(db, 'arsip'));
                snapArsip.forEach(docSnap => {
                    const d = docSnap.data();
                    arsipItems.push({
                        id: docSnap.id, judul: d.judul || 'Tanpa Judul',
                        kategori: d.kategori || 'Lainnya', icon: '🗃️',
                        deskripsi: d.keterangan || '', tanggal: '-',
                        sumber: 'arsip', warna: '#a8edea', manual: true
                    });
                });

                arsipItems.sort((a, b) => (b.tanggal || '').localeCompare(a.tanggal || ''));

                if (arsipItems.length === 0) {
                    listData.innerHTML = `
                        <div class="empty-state">
                            <div class="icon-big">📭</div>
                            <p>Belum ada data di arsip.</p>
                            <p style="margin-top:10px;font-size:13px;color:#a0aec0;">

                listData.innerHTML = `

                arsipItems.forEach(item => {
                    const el = document.createElement('div');
                    el.className = 'list-item';
                    el.style.borderLeftColor = item.warna;
                    el.innerHTML = `
                        <div class="list-item-info">
                            <h4>${item.icon} ${escapeHtml(item.judul)}</h4>
                            ${item.deskripsi ? `<p>${escapeHtml(String(item.deskripsi).substring(0, 100))}</p>` : ''}
                            <div style="margin-top:6px;font-size:12px;color:#718096;">

                            <button class="btn-icon btn-hapus" title="Hapus dari sumber">🗑️</button>

                    `;
                    el.querySelector('.btn-hapus').onclick = async () => {
                        if (confirm('Hapus item ini dari arsip?\n(Ini akan menghapus data aslinya juga)')) {
                            try {
                                await deleteDoc(doc(db, item.sumber, item.id));
                                showToast('🗑️ Item dihapus!');
                                await tampilkanArsip();
                            } catch (e) {
                                showToast('❌ Gagal hapus: ' + e.message, 'error');
                            }
                        }
                    };
                    listData.appendChild(el);
                });

            } catch (error) {
                console.error('Error:', error);
                listData.innerHTML = `<div class="empty-state"><div class="icon-big">❌</div><p>Gagal memuat arsip: ${error.message}</p></div>`;
            }
        }

        window.bukaModalKeuangan = function(jenis) {
            editId = null;
            document.getElementById('modalTitle').textContent = 
                jenis === 'pemasukan' ? '📥 Tambah Pemasukan' : '📤 Tambah Pengeluaran';
            
            const formFields = document.getElementById('formFields');
            formFields.innerHTML = `
                <input type="hidden" name="jenis" value="${jenis}">
                <div class="form-group">
                    <label>Keterangan *</label>
                    <input type="text" name="keterangan" required placeholder="Contoh: Gaji bulanan...">
                </div>
                <div class="form-group">
                    <label>Jumlah (Rp) *</label>
                    <input type="text" name="jumlah" required placeholder="Contoh: 800000" class="input-currency" inputmode="numeric">
                </div>
                <div class="form-group">
                    <label>Tanggal *</label>
                    <input type="date" name="tanggal" required value="${new Date().toISOString().slice(0,10)}">
                </div>
                <div class="form-group">
                    <label>Kategori</label>
                    <select name="kategori">
                        <option value="Umum">Umum</option>
                        <option value="Gaji">Gaji</option>
                        <option value="Bonus">Bonus</option>
                        <option value="Makanan">Makanan</option>
                        <option value="Transportasi">Transportasi</option>
                        <option value="Belanja">Belanja</option>
                        <option value="Tagihan">Tagihan</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>
            `;
            document.getElementById('modal').classList.add('active');
            aktifkanAutoFormat();
        };

        window.lihatSemuaKeuangan = async function() {
            const listEl = document.getElementById('listKeuangan');
            listEl.innerHTML = '<div class="empty-state"><div class="icon-big">⏳</div>Memuat...</div>';
            
            try {
                const snap = await getDocs(query(collection(db, 'transaksi'), orderBy('createdAt', 'desc')));
                if (snap.empty) {
                    listEl.innerHTML = '<div class="empty-state"><div class="icon-big">📭</div><p>Belum ada transaksi.</p></div>';
                    return;
                }
                listEl.innerHTML = '';
                snap.forEach(docSnap => {
                    const d = docSnap.data();
                    const id = docSnap.id;
                    const isMasuk = d.jenis === 'pemasukan';
                    const item = document.createElement('div');
                    item.className = 'list-item';
                    item.style.borderLeftColor = isMasuk ? 'var(--green)' : 'var(--red)';
                    item.innerHTML = `
                        <div class="list-item-info">
                            <h4>${isMasuk ? '📥' : '📤'} ${escapeHtml(d.keterangan || '-')}</h4>
                            <p style="color:${isMasuk ? 'var(--green)' : 'var(--red)'};font-weight:700">
                                ${isMasuk ? '+' : '-'} Rp ${Number(d.jumlah || 0).toLocaleString('id-ID')}
                            </p>
                            <div style="margin-top:6px;font-size:12px;color:#718096;">
                                📅 ${d.tanggal || '-'} • 🏷️ ${d.kategori || 'Umum'}
                            </div>
                        </div>
                        <div class="list-item-actions">
                            <button class="btn-icon btn-hapus" title="Hapus">🗑️</button>
                        </div>
                    `;
                    item.querySelector('.btn-hapus').onclick = async () => {
                        if (confirm('Hapus transaksi ini?')) {
                            await deleteDoc(doc(db, 'transaksi', id));
                            showToast('🗑️ Terhapus!');
                            await loadKeuangan();
                            await lihatSemuaKeuangan();
                        }
                    };
                    listEl.appendChild(item);
                });
            } catch (e) {
                listEl.innerHTML = `<div class="empty-state">❌ ${e.message}</div>`;
            }
        };

        async function loadKeuangan() {
            const bulan = document.getElementById('filterBulanKeuangan').value;
            if (!bulan) return;

            const [tahun, bln] = bulan.split('-');
            const namaBulan = new Date(tahun, bln - 1).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
            document.getElementById('periodeKeuangan').textContent = 'Periode: ' + namaBulan;

            try {
                const snap = await getDocs(collection(db, 'transaksi'));
                let masuk = 0, keluar = 0;

                snap.forEach(docSnap => {
                    const d = docSnap.data();
                    if (!d.tanggal) return;
                    if (d.tanggal.startsWith(bulan)) {
                        if (d.jenis === 'pemasukan') masuk += Number(d.jumlah) || 0;
                        else keluar += Number(d.jumlah) || 0;
                    }
                });

                const saldo = masuk - keluar;
                document.getElementById('saldoBulan').textContent = 'Rp ' + saldo.toLocaleString('id-ID');
                document.getElementById('totalMasukBulan').textContent = 'Rp ' + masuk.toLocaleString('id-ID');
                document.getElementById('totalKeluarBulan').textContent = 'Rp ' + keluar.toLocaleString('id-ID');

                const max = Math.max(masuk, keluar, 1);
                const maxHeight = 160;
                const tinggiMasuk = (masuk / max) * maxHeight;
                const tinggiKeluar = (keluar / max) * maxHeight;
                
                document.getElementById('barMasuk').style.height = Math.max(5, tinggiMasuk) + 'px';
                document.getElementById('barKeluar').style.height = Math.max(5, tinggiKeluar) + 'px';
                document.getElementById('labelBarMasuk').textContent = 'Rp ' + masuk.toLocaleString('id-ID');
                document.getElementById('labelBarKeluar').textContent = 'Rp ' + keluar.toLocaleString('id-ID');

            } catch (e) {
                console.error(e);
            }
        }

        const originalSimpan = window.simpanData;
        window.simpanData = async function(e) {
            e.preventDefault();
            
            if (currentMenu === 'keuangan') {
                const formData = new FormData(e.target);
                const data = {};
                formData.forEach((v, k) => {
                    if (k === 'jumlah') data[k] = v.replace(/\./g, '');
                    else data[k] = v;
                });
                
                try {
                    await addDoc(collection(db, 'transaksi'), {...data, createdAt: serverTimestamp()});
                    showToast('✅ Transaksi berhasil disimpan!');
                    tutupModal();
                    await loadKeuangan();
                    await loadStatistik();
                } catch (err) {
                    showToast('❌ Gagal: ' + err.message, 'error');
                }
                return;
            }

            return originalSimpan.call(this, e);
        };

        async function loadStatistik() {
            try {
                const collections = ['catatan', 'agenda_todo', 'target_habit', 'pekerjaan', 'jurnal', 'daily_mingguan', 'pelajaran'];
                let total = 0;
                for (const col of collections) {
                    const snap = await getDocs(collection(db, col));
                    total += snap.size;
                }
                document.getElementById('statTotal').textContent = total;

                const snapCatatan = await getDocs(collection(db, 'catatan'));
                document.getElementById('statCatatan').textContent = snapCatatan.size;

                const snapAgenda = await getDocs(collection(db, 'agenda_todo'));
                document.getElementById('statAgenda').textContent = snapAgenda.size;

                const snapTrx = await getDocs(collection(db, 'transaksi'));
                let totalMasuk = 0, totalKeluar = 0;
                snapTrx.forEach(d => {
                    const data = d.data();
                    if (data.jenis === 'pemasukan') totalMasuk += Number(data.jumlah) || 0;
                    else totalKeluar += Number(data.jumlah) || 0;
                });
                const saldo = totalMasuk - totalKeluar;
                document.getElementById('statKeuangan').textContent = 'Rp ' + saldo.toLocaleString('id-ID');
            } catch (e) {
                console.error('Gagal load statistik:', e);
            }
        }

        loadStatistik();
    </script>
</body>
</html>
