function getRekStyle(rek) {
  if (REK_STYLE_DEFAULT[rek]) return REK_STYLE_DEFAULT[rek];
  const custom = daftarRekeningCustom.find(r => r.nama === rek);
  if (custom) {
    const warna = WARNA_CUSTOM[custom.warna] || WARNA_CUSTOM['abu'];
    return { icon: custom.icon || '🏦', bg: warna.bg, shadow: warna.shadow };
  }
  return { icon: '🏦', bg: 'linear-gradient(135deg,#64748b,#475569)', shadow: 'rgba(100,116,139,0.35)' };
}

  } catch (e) {
    console.error('Soft delete gagal:', e);
    throw e;

}

async function loadRekeningCustom() {
  try {
    const snap = await getDocs(collection(db, 'rekening_custom'));
    daftarRekeningCustom = [];
    rekeningHidden = [];
    snap.forEach(docSnap => {
      const data = docSnap.data();
      if (data.hidden === true) {
        rekeningHidden.push(data.nama);
      } else {
        daftarRekeningCustom.push({ id: docSnap.id, ...data });
      }
    });
    updateSemuaRekening();
    renderKelolaRekening();
  } catch (e) { console.error('Load rekening gagal:', e); }
}

function updateSemuaRekening() {
  const defaultRek = ['Tunai','BCA','Mandiri','BRI','BNI','BSI','CIMB','Permata','Danamon','BTN','Dana','OVO','GoPay','ShopeePay','LinkAja'];
  const customNama = daftarRekeningCustom.map(r => r.nama);
  
  semuaRekening = defaultRek.filter(r => !rekeningHidden.includes(r));
  
  customNama.forEach(n => {
    if (!semuaRekening.includes(n) && !rekeningHidden.includes(n)) {
      semuaRekening.push(n);
    }
  });
}

/* ⭐ RENDER KELOLA REKENING dengan tombol EDIT & HAPUS */
function renderKelolaRekening() {
  const container = document.getElementById('kelolaRekeningList');
  if (!container) return;

  if (semuaRekening.length === 0) {
    container.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:20px;color:#a0aec0;font-size:13px;">
        Belum ada rekening.
      </div>
    `;
    return;
  }

  container.innerHTML = '';
  semuaRekening.forEach(rek => {
    const style = getRekStyle(rek);
    const item = document.createElement('div');
    item.className = 'kelola-rekening-item';
    item.innerHTML = `
      <div class="icon-box" style="background:${style.bg};">${style.icon}</div>
      <div class="rekening-name">${escapeHtml(rek)}</div>
      <button class="btn-edit-rek" onclick="editRekeningFromKelola('${rek}')" title="Edit rekening">✏️</button>
      <button class="btn-hapus-rek" onclick="hapusRekeningFromKelola('${rek}')" title="Hapus rekening">🗑️</button>
    `;
    container.appendChild(item);
  });
}

/* ⭐ SIMPAN EDIT REKENING */
async function simpanEditRekening(e, namaLama) {
  e.preventDefault();
  const formData = new FormData(e.target);
  const namaBaru = (formData.get('nama_rekening') || '').trim();
  const iconBaru = (formData.get('icon_rekening') || '🏦').trim() || '🏦';
  let warnaBaru = formData.get('warna_rekening') || 'auto';

  if (!namaBaru) {
    showToast('❌ Nama rekening wajib diisi!', 'error');
    return;
  }

  if (warnaBaru === 'auto') {
    const warnaArr = ['biru','hijau','merah','ungu','oranye','cyan','pink','abu'];
    warnaBaru = warnaArr[Math.floor(Math.random() * warnaArr.length)];
  }

  try {
    const snap = await getDocs(collection(db, 'rekening_custom'));
    let foundId = null;
    
    for (const docSnap of snap.docs) {
      if (docSnap.data().nama.toLowerCase() === namaLama.toLowerCase()) {
        foundId = docSnap.id;
        break;
      }
    }

    if (foundId) {
      await updateDoc(doc(db, 'rekening_custom', foundId), {
        nama: namaBaru,
        icon: iconBaru,
        warna: warnaBaru,
        updatedAt: serverTimestamp()
      });
    } else {
      // Buat record baru (kalau ini rekening default)
      await addDoc(collection(db, 'rekening_custom'), {
        nama: namaBaru,
        icon: iconBaru,
        warna: warnaBaru,
        hidden: false,
        originalName: namaLama,
        createdAt: serverTimestamp()
      });

      // Sembunyikan nama lama kalau beda
      if (namaBaru.toLowerCase() !== namaLama.toLowerCase()) {
        await addDoc(collection(db, 'rekening_custom'), {
          nama: namaLama,
          icon: '🏦',
          warna: 'auto',
          hidden: true,
          replacedBy: namaBaru,
          createdAt: serverTimestamp()
        });
      }
    }

    showToast('✅ Rekening berhasil diubah!');
    tutupModal();
    await loadRekeningCustom();
    await loadKeuangan();
  } catch (err) {
    console.error('Error edit rekening:', err);
    showToast('❌ Gagal: ' + err.message, 'error');
  }
}

/* ⭐ HAPUS REKENING dari PANEL KELOLA */
window.hapusRekeningFromKelola = async function(namaRek) {
  if (!confirm(`Hapus rekening "${namaRek}"?\n\nRekening ini akan hilang dari semua daftar.`)) return;
  
  try {
    const snap = await getDocs(collection(db, 'rekening_custom'));
    let found = false;
    
    for (const docSnap of snap.docs) {
      const d = docSnap.data();
      if (d.nama.toLowerCase() === namaRek.toLowerCase()) {
        await updateDoc(doc(db, 'rekening_custom', docSnap.id), { hidden: true });
        found = true;
      }
    }
    
    if (!found) {
      await addDoc(collection(db, 'rekening_custom'), {
        nama: namaRek, icon: '🏦', warna: 'auto',
        hidden: true, createdAt: serverTimestamp()
      });
    }
    
    showToast('🗑️ Rekening "' + namaRek + '" dihapus!');
    
    if (filterRekening === namaRek) filterRekening = 'semua';
    
    await loadRekeningCustom();
    await loadKeuangan();
    
  } catch (e) {
    showToast('❌ Gagal: ' + e.message, 'error');
  }
};

async function simpanRekeningBaru(e) {
  e.preventDefault();
  const formData = new FormData(e.target);
  const nama = (formData.get('nama_rekening') || '').trim();
  const icon = (formData.get('icon_rekening') || '🏦').trim() || '🏦';
  let warna = formData.get('warna_rekening') || 'auto';

  if (!nama) {
    showToast('❌ Nama rekening wajib diisi!', 'error');
    return;
  }

  const snap = await getDocs(collection(db, 'rekening_custom'));
  let sudahAda = false;
  let hiddenId = null;
  snap.forEach(docSnap => {
    const d = docSnap.data();
    if (d.nama.toLowerCase() === nama.toLowerCase()) {
      if (d.hidden === true) {
        hiddenId = docSnap.id;
      } else {
        sudahAda = true;
      }
    }
  });

  if (sudahAda) {
    showToast('⚠️ Rekening "' + nama + '" sudah ada!', 'error');
    return;
  }

  if (warna === 'auto') {
    const warnaArr = ['biru','hijau','merah','ungu','oranye','cyan','pink','abu'];
    warna = warnaArr[Math.floor(Math.random() * warnaArr.length)];
  }

  try {
    if (hiddenId) {
      await updateDoc(doc(db, 'rekening_custom', hiddenId), {
        nama, icon, warna, hidden: false,
        updatedAt: serverTimestamp()
      });
    } else {
      await addDoc(collection(db, 'rekening_custom'), {
        nama, icon, warna, hidden: false,
        createdAt: serverTimestamp()
      });
    }
    
    showToast('✅ Rekening "' + nama + '" ditambahkan!');
    tutupModal();
    
    await loadRekeningCustom();
    await loadKeuangan();
  } catch (err) {
    console.error('Error tambah rekening:', err);
    showToast('❌ Gagal: ' + err.message, 'error');
  }
}

window.bukaHalaman = async function(namaMenu, el) {
  try {
    if (el) {
      document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
      el.classList.add('active');
    }
    document.querySelectorAll('.page-menu').forEach(p => p.classList.remove('active'));

    if (namaMenu === 'dashboard') {
      document.getElementById('page-dashboard').classList.add('active');
      document.getElementById('pageTitle').textContent = 'Dashboard';
      return;
    }

    currentMenu = namaMenu;
    document.getElementById('page-menu').classList.add('active');
    document.getElementById('menuNormal').style.display = 'none';
    document.getElementById('menuKeuangan').style.display = 'none';

    const tombolTambah = document.querySelector('.page-header .btn-tambah');
    if (tombolTambah) tombolTambah.style.display = 'block';

    if (namaMenu === 'keuangan') {
      document.getElementById('pageTitle').textContent = '💰 Keuangan';
      document.getElementById('menuKeuangan').style.display = 'block';
      const today = new Date().toISOString().slice(0, 7);
      const filterBulan = document.getElementById('filterBulanKeuangan');
      if (!filterBulan.value) filterBulan.value = today;
      filterBulan.onchange = () => loadKeuangan();
      await loadRekeningCustom();
      await loadKeuangan();
    } else if (namaMenu === 'arsip') {
      document.getElementById('pageTitle').textContent = '🗃️ Arsip';
      document.getElementById('menuNormal').style.display = 'block';
      document.getElementById('menuTitle').textContent = '🗃️ Arsip';
      const tombol = document.querySelector('.page-header .btn-tambah');
      if (tombol) tombol.style.display = 'none';
      document.getElementById('menuTabs').style.display = 'none';
      await tampilkanArsip();
    } else if (namaMenu === 'jadwal') {
      document.getElementById('pageTitle').textContent = '⏰ Jadwal';
      document.getElementById('menuNormal').style.display = 'block';
      document.getElementById('menuTitle').textContent = '⏰ Jadwal';
      hariAktif = getHariIni();
      const tabsEl = document.getElementById('menuTabs');
      tabsEl.style.display = 'flex';
      tabsEl.innerHTML = '';
      [{id:'mingguan',label:'📅 Mingguan'},{id:'pelajaran',label:'📚 Pelajaran'}].forEach((tab, i) => {
        const btn = document.createElement('button');
        btn.className = 'tab' + (i === 0 ? ' active' : '');
        btn.textContent = tab.label;
        btn.onclick = () => {
          tabsEl.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          btn.classList.add('active');
          currentTab = tab.id;
          tampilkanJadwal(tab.id);
        };
        tabsEl.appendChild(btn);
      });
      currentTab = 'mingguan';
      await tampilkanJadwal('mingguan');
    } else {
      const config = MENU_CONFIG[namaMenu];
      if (!config) { showToast('⚠️ Menu belum tersedia', 'error'); return; }
      document.getElementById('pageTitle').textContent = config.title;
      document.getElementById('menuNormal').style.display = 'block';
      document.getElementById('menuTitle').textContent = config.title;
      const tabsEl = document.getElementById('menuTabs');
      if (config.tabs) {
        tabsEl.style.display = 'flex';
        tabsEl.innerHTML = '';
        config.tabs.forEach((tab, i) => {
          const btn = document.createElement('button');
          btn.className = 'tab' + (i === 0 ? ' active' : '');
          btn.textContent = tab.label;
          btn.onclick = () => {
            tabsEl.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            currentTab = tab.id;
            tampilkanData(config.collection, tab.id);
          };
          tabsEl.appendChild(btn);
        });
        currentTab = config.tabs[0].id;
        await tampilkanData(config.collection, currentTab);
      } else {
        tabsEl.style.display = 'none';
        currentTab = null;
        await tampilkanData(config.collection, null);
      }
    }

    if (window.innerWidth <= 900) {
      document.getElementById('sidebar').classList.remove('active');
      document.getElementById('overlay').classList.remove('active');
    }
  } catch (error) {
    console.error('Error bukaHalaman:', error);
    showToast('❌ Error: ' + error.message, 'error');
  }
};

window.pindahHari = function(arah) {
  const idx = HARI_URUT.indexOf(hariAktif);
  let newIdx;
  if (arah === 'next') newIdx = (idx + 1) % HARI_URUT.length;
  else newIdx = (idx - 1 + HARI_URUT.length) % HARI_URUT.length;
  hariAktif = HARI_URUT[newIdx];
  tampilkanJadwal(currentTab);
};

window.kembaliHariIni = function() {
  hariAktif = getHariIni();
  tampilkanJadwal(currentTab);
};

function getTanggalUntukHari(hari) {
  const idxHariIni = HARI_URUT.indexOf(getHariIni());
  const idxTarget = HARI_URUT.indexOf(hari);
  const selisih = idxTarget - idxHariIni;
  const targetDate = new Date(new Date().getTime() + selisih * 86400000);
  return targetDate.toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
}

function renderNavigasiHari(listData) {
  const hariIni = getHariIni();
  const isHariIni = hariAktif === hariIni;
  const hariClass = 'hari-' + hariAktif.toLowerCase();
  const nav = document.createElement('div');
  nav.className = 'nav-hari';
  nav.innerHTML = `
    <div class="nav-hari-info">
      <div class="nav-hari-icon ${hariClass}">📅</div>
      <div class="nav-hari-text">
        <h3>${hariAktif} ${isHariIni ? '<span class="badge-hari-ini">HARI INI</span>' : ''}</h3>
        <p id="nav-hari-tanggal">Memuat...</p>
      </div>
    </div>
    <div class="nav-hari-controls">
      <button class="btn-nav-hari" onclick="pindahHari('prev')">◀</button>
      <button class="btn-nav-today ${isHariIni ? 'disabled' : ''}" onclick="kembaliHariIni()" ${isHariIni ? 'disabled' : ''}>Hari Ini</button>
      <button class="btn-nav-hari" onclick="pindahHari('next')">▶</button>
    </div>
  `;
  listData.appendChild(nav);
  setTimeout(() => {
    const el = document.getElementById('nav-hari-tanggal');
    if (el) el.textContent = getTanggalUntukHari(hariAktif);
  }, 50);
}

async function tampilkanJadwal(tabJadwal) {
  const listData = document.getElementById('listData');
  listData.innerHTML = '<div class="empty-state"><div class="icon-big">⏳</div>Memuat...</div>';
  if (!hariAktif) hariAktif = getHariIni();

  try {
    const hariClass = 'hari-' + hariAktif.toLowerCase();
    const snapshot = await getDocs(collection(db, 'jadwal'));
    const items = [];
    snapshot.forEach(docSnap => {
      const data = docSnap.data();
      if (data.jenis === tabJadwal && data.hari === hariAktif) items.push({ id: docSnap.id, ...data });
    });
    items.sort((a, b) => (a.jam_mulai || '').localeCompare(b.jam_mulai || ''));

    listData.innerHTML = '';
    renderNavigasiHari(listData);

    if (items.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      const label = tabJadwal === 'mingguan' ? 'jadwal' : 'mata pelajaran';
      empty.innerHTML = `<div class="icon-big">📭</div><p>Belum ada ${label} untuk <strong>${hariAktif}</strong>.</p><p style="margin-top:8px;font-size:13px;color:#a0aec0;">Klik <strong>"+ Tambah"</strong> untuk membuat.</p>`;
      listData.appendChild(empty);
      return;
    }

    const wrap = document.createElement('div');
    wrap.className = 'sched-list-keren';
    items.forEach(data => {
      const id = data.id;
      const item = document.createElement('div');
      item.className = `sched-item-keren ${hariClass}`;
      const jamMulai = data.jam_mulai || '-';
      const jamSelesai = data.jam_selesai || '';
      const judul = tabJadwal === 'mingguan' ? data.kegiatan : data.mapel;
      const icon = tabJadwal === 'mingguan' ? '📌' : '📚';
      const metaExtra = tabJadwal === 'pelajaran' ? 
        `${data.guru ? `<span>👨‍🏫 ${escapeHtml(data.guru)}</span>` : ''}${data.ruang ? `<span>🏫 ${escapeHtml(data.ruang)}</span>` : ''}` :
        `${data.lokasi ? `<span>📍 ${escapeHtml(data.lokasi)}</span>` : ''}`;

      item.innerHTML = `
        <div class="sched-jam-keren ${hariClass}">
          <div class="sched-jam-label">Jam</div>
          <div class="sched-jam-mulai">${jamMulai}</div>
          ${jamSelesai ? `<div class="sched-jam-divider"></div><div class="sched-jam-selesai">s/d ${jamSelesai}</div>` : ''}
        </div>
        <div class="sched-konten-keren">
          <div class="sched-judul-keren">${icon} ${escapeHtml(judul || '-')}</div>
          <div class="sched-meta-keren">${metaExtra}</div>
          ${data.catatan ? `<div class="sched-catatan-keren">📝 ${escapeHtml(data.catatan)}</div>` : ''}
        </div>
        <div class="sched-actions-keren">
          <button class="btn-icon btn-edit" title="Edit">✏️</button>
          <button class="btn-icon btn-hapus" title="Pindah ke Arsip">🗑️</button>
        </div>
      `;
      item.querySelector('.btn-edit').onclick = () => editData(id, data, 'jadwal');
      item.querySelector('.btn-hapus').onclick = async () => {
        if (confirm('Pindahkan ke Arsip?')) {
          await softDelete('jadwal', id, data, judul || 'Jadwal');
          showToast('🗑️ Dipindahkan ke Arsip!');
          await tampilkanJadwal(tabJadwal);
        }
      };
      wrap.appendChild(item);
    });
    listData.appendChild(wrap);
  } catch (error) {
    console.error('Error:', error);
    listData.innerHTML = `<div class="empty-state"><div class="icon-big">❌</div><p>Gagal: ${error.message}</p></div>`;
  }
}

window.hapusYangSudahDibeli = async function() {
  if (!confirm('Pindahkan semua item yang sudah selesai ke Arsip?')) return;
  try {
    const snap = await getDocs(collection(db, 'belanja'));
    let count = 0;
    for (const docSnap of snap.docs) {
      const d = docSnap.data();
      if (d.dibeli === true) {
        await softDelete('belanja', docSnap.id, d, d.nama || 'Item');
        count++;
      }
    }
    showToast(`🗑️ ${count} item dipindah ke Arsip!`);
    await tampilkanData('belanja', null);
  } catch (e) { showToast('❌ Gagal: ' + e.message, 'error'); }
};

async function tampilkanBelanja() {
  const listData = document.getElementById('listData');
  listData.innerHTML = '<div class="empty-state"><div class="icon-big">⏳</div>Memuat...</div>';

  try {
    const snapshot = await getDocs(collection(db, 'belanja'));
    let items = [];
    snapshot.forEach(docSnap => {
      items.push({ id: docSnap.id, ...docSnap.data() });
    });

    const totalItems = items.length;
    const belumSelesai = items.filter(i => i.dibeli !== true).length;
    const sudahSelesai = items.filter(i => i.dibeli === true).length;

    if (filterBelanja === 'belum') items = items.filter(i => i.dibeli !== true);
    else if (filterBelanja === 'sudah') items = items.filter(i => i.dibeli === true);

    items.sort((a, b) => {
      const aS = a.dibeli === true ? 1 : 0;
      const bS = b.dibeli === true ? 1 : 0;
      if (aS !== bS) return aS - bS;
      return (a.kategori || '').localeCompare(b.kategori || '');
    });

    listData.innerHTML = '';

    const infoBar = document.createElement('div');
    infoBar.className = 'filter-belanja-bar';
    infoBar.innerHTML = `
      <div class="filter-belanja-btns">
        <button onclick="setFilterBelanja('belum')" style="padding:8px 14px;border:2px solid ${filterBelanja === 'belum' ? '#667eea' : '#e2e8f0'};background:${filterBelanja === 'belum' ? 'linear-gradient(135deg,#667eea,#764ba2)' : 'white'};color:${filterBelanja === 'belum' ? 'white' : '#4a5568'};border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;">⏳ Belum (${belumSelesai})</button>
        <button onclick="setFilterBelanja('sudah')" style="padding:8px 14px;border:2px solid ${filterBelanja === 'sudah' ? '#48bb78' : '#e2e8f0'};background:${filterBelanja === 'sudah' ? 'linear-gradient(135deg,#48bb78,#38a169)' : 'white'};color:${filterBelanja === 'sudah' ? 'white' : '#4a5568'};border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;">✅ Selesai (${sudahSelesai})</button>
        <button onclick="setFilterBelanja('semua')" style="padding:8px 14px;border:2px solid ${filterBelanja === 'semua' ? '#667eea' : '#e2e8f0'};background:${filterBelanja === 'semua' ? 'linear-gradient(135deg,#667eea,#764ba2)' : 'white'};color:${filterBelanja === 'semua' ? 'white' : '#4a5568'};border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;">📋 Semua (${totalItems})</button>
      </div>
      ${sudahSelesai > 0 ? `<button onclick="hapusYangSudahDibeli()" style="padding:8px 14px;border:none;background:#fee2e2;color:#991b1b;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;">🗑️ Pindah yang Selesai ke Arsip</button>` : ''}
    `;
    listData.appendChild(infoBar);

    if (items.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      const pesan = filterBelanja === 'belum' ? 'Semua item sudah selesai! 🎉' : filterBelanja === 'sudah' ? 'Belum ada item yang selesai.' : 'Daftar masih kosong.';
      empty.innerHTML = `<div class="icon-big">${filterBelanja === 'belum' && totalItems > 0 ? '🎉' : '📋'}</div><p>${pesan}</p><p style="margin-top:8px;font-size:13px;color:#a0aec0;">Klik <strong>"+ Tambah"</strong> untuk menambah item.</p>`;
      listData.appendChild(empty);
      return;
    }

    const perKategori = {};
    items.forEach(item => {
      const kat = item.kategori || '📝 Lainnya';
      if (!perKategori[kat]) perKategori[kat] = [];
      perKategori[kat].push(item);
    });

    const katKeys = Object.keys(perKategori).sort((a, b) => a.localeCompare(b));

    katKeys.forEach(kategori => {
      const header = document.createElement('div');
      header.style.cssText = 'background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:10px 16px;border-radius:12px;font-weight:700;font-size:13.5px;margin-bottom:10px;margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;';
      header.innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kategori}</span><span style="background:rgba(255,255,255,0.25);padding:3px 10px;border-radius:20px;font-size:11px;flex-shrink:0;">${perKategori[kategori].length}</span>`;
      listData.appendChild(header);

      perKategori[kategori].forEach(data => {
        const id = data.id;
        const sudahSelesai2 = data.dibeli === true;
        const item = document.createElement('div');
        item.className = 'list-item' + (sudahSelesai2 ? ' selesai' : '');
        item.style.borderLeftColor = sudahSelesai2 ? 'var(--green)' : '#fa709a';
        item.style.marginBottom = '8px';
        item.innerHTML = `
          <div class="check-selesai ${sudahSelesai2 ? 'checked' : ''}" style="width:30px;height:30px;font-size:15px;">✓</div>
          <div class="list-item-info">
            <h4 class="${sudahSelesai2 ? 'selesai-teks' : ''}" style="font-size:15px;">📌 ${escapeHtml(data.nama || '-')}</h4>
            ${data.jumlah ? `<p class="${sudahSelesai2 ? 'selesai-teks' : ''}" style="font-weight:600;color:#667eea;">📦 ${escapeHtml(data.jumlah)}</p>` : ''}
            ${data.catatan ? `<div style="margin-top:4px;font-size:12px;color:#a0aec0;font-style:italic;" class="${sudahSelesai2 ? 'selesai-teks' : ''}">📝 ${escapeHtml(data.catatan)}</div>` : ''}
          </div>
          <div class="list-item-actions">
            <button class="btn-icon btn-edit" title="Edit">✏️</button>
            <button class="btn-icon btn-hapus" title="Pindah ke Arsip">🗑️</button>
          </div>
        `;
        item.querySelector('.check-selesai').onclick = async () => {
          await updateDoc(doc(db, 'belanja', id), { dibeli: !sudahSelesai2 });
          await tampilkanData('belanja', null);
          showToast(!sudahSelesai2 ? '✅ ' + data.nama + ' selesai!' : '↩️ Dikembalikan');
        };
        item.querySelector('.btn-edit').onclick = () => editData(id, data, 'belanja');
        item.querySelector('.btn-hapus').onclick = async () => {
          if (confirm('Pindahkan ke Arsip?')) {
            await softDelete('belanja', id, data, data.nama || 'Item');
            showToast('🗑️ Dipindahkan ke Arsip!');
            await tampilkanData('belanja', null);
          }
        };
        listData.appendChild(item);
      });
    });

  } catch (error) {
    console.error('Error:', error);
    listData.innerHTML = `<div class="empty-state"><div class="icon-big">❌</div><p>Gagal: ${error.message}</p></div>`;
  }
}

async function tampilkanData(koleksi, tab) {
  if (koleksi === 'belanja') return tampilkanBelanja();

  const listData = document.getElementById('listData');
  listData.innerHTML = '<div class="empty-state"><div class="icon-big">⏳</div>Memuat...</div>';

  try {
    const snapshot = await getDocs(collection(db, koleksi));
    let items = [];
    snapshot.forEach(docSnap => {
      const data = docSnap.data();
      if (tab && data.jenis !== tab) return;
      items.push({ id: docSnap.id, ...data });
    });
    items.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

    if (items.length === 0) {
      listData.innerHTML = `<div class="empty-state"><div class="icon-big">📭</div><p>Belum ada data. Klik <strong>"+ Tambah"</strong> untuk membuat.</p></div>`;
      return;
    }

    listData.innerHTML = '';

    if (tab === 'habit' || koleksi === 'target_habit') {
      items.forEach(data => {
        const id = data.id;
        const progress = Number(data.progress) || 0;
        const progressClass = progress >= 80 ? 'high' : progress >= 50 ? 'medium' : progress >= 20 ? '' : 'low';
        const statusText = progress >= 100 ? '✅ Selesai!' : progress >= 80 ? '🔥 Hampir' : progress >= 50 ? '💪 Setengah' : progress >= 20 ? '👍 Mulai' : '🌱 Baru';
        const card = document.createElement('div');
        card.className = 'habit-card';
        card.innerHTML = `
          <div class="habit-header"><h4>${escapeHtml(data.kebiasaan || 'Tanpa Nama')}</h4><button class="btn-icon btn-hapus" title="Pindah ke Arsip">🗑️</button></div>
          <div class="habit-target">🎯 Target: ${escapeHtml(data.target_harian || '-')}</div>
          <div class="progress-bar"><div class="progress-fill ${progressClass}" style="width:${progress}%"></div></div>
          <div class="progress-text"><span class="persen">${progress}%</span><span class="status">${statusText}</span></div>
          <div class="habit-actions">
            <button class="btn-progress tambah" data-action="+10">+10%</button>
            <button class="btn-progress tambah" data-action="+20">+20%</button>
            <button class="btn-progress kurang" data-action="-10">-10%</button>
            <button class="btn-progress selesai" data-action="100">✅ 100%</button>
            <button class="btn-progress reset" data-action="0">🔄 Reset</button>
          </div>
        `;
        card.querySelector('.btn-hapus').onclick = async () => {
          if (confirm('Pindahkan ke Arsip?')) {
            await softDelete(koleksi, id, data, data.kebiasaan || 'Habit');
            showToast('🗑️ Dipindahkan ke Arsip!');
            await tampilkanData(koleksi, tab);
          }
        };
        card.querySelectorAll('.btn-progress').forEach(btn => {
          btn.onclick = async () => {
            const action = btn.dataset.action;
            let newProgress;
            if (action === '100') newProgress = 100;
            else if (action === '0') newProgress = 0;
            else newProgress = Math.max(0, Math.min(100, progress + Number(action)));
            await updateDoc(doc(db, koleksi, id), { progress: newProgress });
            await tampilkanData(koleksi, tab);
            if (newProgress === 100) showToast('🎉 Habit 100%!');
          };
        });
        listData.appendChild(card);
      });
      return;
    }

    if (koleksi === 'link') {
      items.forEach(data => {
        const id = data.id;
        const url = data.url || '#';
        const item = document.createElement('div');
        item.className = 'list-item';
        item.style.borderLeftColor = '#30cfd0';
        item.innerHTML = `
          <div class="list-item-info" style="cursor:pointer;" onclick="window.open('${escapeHtml(url)}','_blank')">
            <h4 style="color:var(--primary);text-decoration:underline;">🔗 ${escapeHtml(data.nama || '-')}</h4>
            <p style="color:#30cfd0;word-break:break-all;">${escapeHtml(url)}</p>
            ${data.kategori ? `<div style="margin-top:5px;font-size:11.5px;color:#718096;">🏷️ ${escapeHtml(data.kategori)}</div>` : ''}
            ${data.catatan ? `<div style="margin-top:5px;font-size:11.5px;color:#a0aec0;font-style:italic;">📝 ${escapeHtml(data.catatan)}</div>` : ''}
          </div>
          <div class="list-item-actions">
            <button class="btn-icon" style="background:#dbeafe;color:#1e40af;" title="Buka">🔗</button>
            <button class="btn-icon btn-edit">✏️</button>
            <button class="btn-icon btn-hapus" title="Pindah ke Arsip">🗑️</button>
          </div>
        `;
        item.querySelector('.btn-icon[title="Buka"]').onclick = () => window.open(url, '_blank');
        item.querySelector('.btn-edit').onclick = () => editData(id, data, koleksi);
        item.querySelector('.btn-hapus').onclick = async () => {
          if (confirm('Pindahkan ke Arsip?')) {
            await softDelete(koleksi, id, data, data.nama || 'Link');
            showToast('🗑️ Dipindahkan ke Arsip!');
            await tampilkanData(koleksi, tab);
          }
        };
        listData.appendChild(item);
      });
      return;
    }

    const pakaiCheckbox = (tab === 'todo');
    items.forEach(data => {
      const id = data.id;
      let title = data.judul || data.nama || data.keterangan || data.tugas || data.kebiasaan || 'Tanpa Judul';
      const infoItems = [];
      if (data.tanggal) infoItems.push(`📅 ${data.tanggal}`);
      if (data.waktu) infoItems.push(`🕐 ${data.waktu.replace('T',' ')}`);
      if (data.deadline) infoItems.push(`⏰ ${data.deadline}`);
      if (data.status) infoItems.push(`📌 ${data.status}`);
      if (data.prioritas) infoItems.push(`⚡ ${data.prioritas}`);
      if (data.kategori) infoItems.push(`🏷️ ${data.kategori}`);
      const preview = infoItems.join(' • ');
      let deskripsi = data.isi || data.deskripsi || data.catatan || data.kegiatan || '';
      const isSelesai = data.selesai === true;

      const item = document.createElement('div');
      item.className = 'list-item' + (isSelesai ? ' selesai' : '');
      const checkboxHTML = pakaiCheckbox ? `<div class="check-selesai ${isSelesai ? 'checked' : ''}">✓</div>` : '';
      item.innerHTML = `
        ${checkboxHTML}
        <div class="list-item-info">
          <h4 class="${isSelesai ? 'selesai-teks' : ''}">${escapeHtml(title)}</h4>
          ${deskripsi ? `<p class="${isSelesai ? 'selesai-teks' : ''}">${escapeHtml(String(deskripsi).substring(0, 150))}${deskripsi.length > 150 ? '...' : ''}</p>` : ''}
          ${preview ? `<div style="margin-top:5px;font-size:11.5px;color:#718096;" class="${isSelesai ? 'selesai-teks' : ''}">${preview}</div>` : ''}
        </div>
        <div class="list-item-actions">
          ${!pakaiCheckbox ? `<button class="btn-icon btn-edit">✏️</button>` : ''}
          <button class="btn-icon btn-hapus" title="Pindah ke Arsip">🗑️</button>
        </div>
      `;
      if (pakaiCheckbox) {
        item.querySelector('.check-selesai').onclick = async () => {
          await updateDoc(doc(db, koleksi, id), { selesai: !isSelesai });
          await tampilkanData(koleksi, tab);
          showToast(!isSelesai ? '✅ Tugas selesai!' : '↩️ Dibuka kembali');
        };
      }
      const editBtn = item.querySelector('.btn-edit');
      if (editBtn) editBtn.onclick = () => editData(id, data, koleksi);
      item.querySelector('.btn-hapus').onclick = async () => {
        if (confirm('Pindahkan ke Arsip?')) {
          await softDelete(koleksi, id, data, title);
          showToast('🗑️ Dipindahkan ke Arsip!');
          await tampilkanData(koleksi, tab);
        }
      };
      listData.appendChild(item);
    });
  } catch (error) {
    console.error('Error:', error);
    listData.innerHTML = `<div class="empty-state"><div class="icon-big">❌</div><p>Gagal: ${error.message}</p></div>`;
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function aktifkanAutoFormat() {
  document.querySelectorAll('.input-currency').forEach(input => {
    input.addEventListener('input', function() {
      let value = this.value.replace(/\D/g, '');
      if (value) this.value = Number(value).toLocaleString('id-ID');
      else this.value = '';
    });
  });
}

window.bukaModal = function() {
  if (!currentMenu) return;
  editId = null;
  document.getElementById('formData').reset();
  const formFields = document.getElementById('formFields');
  formFields.innerHTML = '';

  const config = MENU_CONFIG[currentMenu];
  let fields = config.tabs ? config.fieldsPerTab[currentTab] : config.fields;
  document.getElementById('modalTitle').textContent = 'Tambah ' + config.title;

  fields.forEach(field => {
    const div = document.createElement('div');
    div.className = 'form-group';
    let input = '';
    if (field.type === 'textarea') {
      input = `<textarea name="${field.name}" ${field.required ? 'required' : ''} placeholder="Masukkan ${field.label.toLowerCase()}..."></textarea>`;
    } else if (field.type === 'select') {
      const options = field.options.map(o => `<option value="${o}">${o}</option>`).join('');
      input = `<select name="${field.name}" ${field.required ? 'required' : ''}>${options}</select>`;
    } else {
      input = `<input type="${field.type}" name="${field.name}" ${field.required ? 'required' : ''} placeholder="Masukkan ${field.label.toLowerCase()}...">`;
    }
    div.innerHTML = `<label>${field.label}${field.required ? ' *' : ''}</label>${input}`;
    formFields.appendChild(div);
  });

  document.getElementById('modal').classList.add('active');
  aktifkanAutoFormat();
};

window.simpanData = async function(e) {
  e.preventDefault();

  const modalTitleCheck = document.getElementById('modalTitle').textContent;
  
  // ⭐ Cek kalau ini form edit rekening
  if (modalTitleCheck.includes('Edit Rekening')) {
    const formDataCheck = new FormData(e.target);
    const namaLama = formDataCheck.get('nama_lama');
    return simpanEditRekening(e, namaLama);
  }

  if (modalTitleCheck.includes('Tambah Rekening')) {
    return simpanRekeningBaru(e);
  }

  if (!currentMenu) return;
  const formData = new FormData(e.target);
  const data = {};
  formData.forEach((value, key) => {
    if (key === 'jumlah') data[key] = value.replace(/\./g, '');
    else data[key] = value;
  });

  try {
    let koleksi;
    if (currentMenu === 'keuangan') {
      koleksi = 'transaksi';
    } else {
      const config = MENU_CONFIG[currentMenu];
      if (!config) {
        showToast('❌ Menu tidak valid!', 'error');
        return;
      }
      koleksi = config.collection;
    }
    
    if (currentTab) data.jenis = currentTab;

    if (editId) {
      await updateDoc(doc(db, koleksi, editId), {...data, updatedAt: serverTimestamp()});
      showToast('✅ Data diperbarui!');
    } else {
      if (currentTab === 'habit') data.progress = Number(data.progress) || 0;
      if (currentTab === 'todo') data.selesai = false;
      if (currentTab === 'target') data.status = data.status || 'Belum Mulai';
      if (currentMenu === 'belanja') data.dibeli = false;
      await addDoc(collection(db, koleksi), {...data, createdAt: serverTimestamp()});
      showToast('✅ Data disimpan!');
    }
    tutupModal();
    if (currentMenu === 'jadwal') await tampilkanJadwal(currentTab);
    else if (currentMenu === 'keuangan') {
      await loadKeuangan();
    }
    else await tampilkanData(koleksi, currentTab);
  } catch (error) {
    console.error('Error:', error);
    showToast('❌ Gagal: ' + error.message, 'error');
  }
};

window.editData = function(id, data, koleksi) {
  if (!currentMenu) return;
  const config = MENU_CONFIG[currentMenu];
  editId = id;
  const fields = config.tabs ? config.fieldsPerTab[currentTab] : config.fields;
  document.getElementById('modalTitle').textContent = 'Edit ' + config.title;
  const formFields = document.getElementById('formFields');
  formFields.innerHTML = '';

  fields.forEach(field => {
    const div = document.createElement('div');
    div.className = 'form-group';
    const value = data[field.name] || '';
    let input = '';
    if (field.type === 'textarea') {
      input = `<textarea name="${field.name}" ${field.required ? 'required' : ''}>${escapeHtml(value)}</textarea>`;
    } else if (field.type === 'select') {
      const options = field.options.map(o => `<option value="${o}" ${value === o ? 'selected' : ''}>${o}</option>`).join('');
      input = `<select name="${field.name}" ${field.required ? 'required' : ''}>${options}</select>`;
    } else {
      input = `<input type="${field.type}" name="${field.name}" value="${escapeHtml(value)}" ${field.required ? 'required' : ''}>`;
    }
    div.innerHTML = `<label>${field.label}${field.required ? ' *' : ''}</label>${input}`;
    formFields.appendChild(div);
  });

  document.getElementById('modal').classList.add('active');
};

    const snap = await getDocs(collection(db, 'arsip_sampah'));

      'jadwal': 'Jadwal',
      'pekerjaan': 'Pekerjaan',
      'belanja': 'Daftar / List',
      'target_habit': 'Habit',

          🗑️ Hapus Semua Arsip Permanen

        const d = new Date(item.deletedAt.seconds * 1000);

      if (data.status) infoTambahan.push(`📌 ${data.status}`);
      if (data.prioritas) infoTambahan.push(`⚡ ${data.prioritas}`);

          await addDoc(collection(db, item.koleksiAsal), {
            ...item.dataAsli,
            restoredAt: serverTimestamp()
          });
          await deleteDoc(doc(db, 'arsip_sampah', item.id));
          showToast('↩️ Data dikembalikan!');
          await tampilkanArsip();
        } catch (e) {
          showToast('❌ Gagal: ' + e.message, 'error');
        }
      };

      el.querySelector('button[title="Hapus Permanen"]').onclick = async () => {
        if (!confirm(`Hapus permanen "${judul}"?\n\nData tidak bisa dikembalikan lagi!`)) return;
        try {
          await deleteDoc(doc(db, 'arsip_sampah', item.id));
          showToast('🗑️ Dihapus permanen!');
          await tampilkanArsip();
        } catch (e) {
          showToast('❌ Gagal: ' + e.message, 'error');
        }
      };

      listData.appendChild(el);
    });

  } catch (error) {
    console.error('Error:', error);
    listData.innerHTML = `<div class="empty-state"><div class="icon-big">❌</div><p>Gagal: ${error.message}</p></div>`;
  }
}

window.hapusSemuaArsip = async function() {
  if (!confirm('Hapus SEMUA arsip secara permanen?\n\nData tidak bisa dikembalikan lagi!')) return;
  if (!confirm('YAKIN? Ini akan menghapus semua data di arsip.')) return;
  try {
    const snap = await getDocs(collection(db, 'arsip_sampah'));
    let count = 0;
    for (const docSnap of snap.docs) {
      await deleteDoc(doc(db, 'arsip_sampah', docSnap.id));
      count++;
    }
    showToast(`🗑️ ${count} item dihapus permanen!`);
    await tampilkanArsip();
  } catch (e) {
    showToast('❌ Gagal: ' + e.message, 'error');
  }
};

  if (listEl.classList.contains('riwayat-container') && listEl.classList.contains('active')) {

      <div style="text-align:center;padding:20px;color:#a0aec0;font-size:12px;">⏳ Memuat...</div>
    </div>
  `;

  try {
    const snap = await getDocs(query(collection(db, 'transaksi'), orderBy('createdAt', 'desc')));
    let items = [];
    snap.forEach(docSnap => {
      items.push({ id: docSnap.id, ...docSnap.data() });
    });

    items = items.filter(i => !rekeningHidden.includes(i.rekening || 'Tunai'));

    if (items.length === 0) {
      listContainer.innerHTML = '<div style="text-align:center;padding:20px;color:#a0aec0;font-size:12px;">📭 Belum ada transaksi</div>';
      return;
    }

    listContainer.innerHTML = '';
    items.forEach(d => {
      const id = d.id;
      const isMasuk = d.jenis === 'pemasukan';
      const item = document.createElement('div');
      item.className = 'riwayat-item' + (isMasuk ? '' : ' keluar');
      item.innerHTML = `
        <div class="r-jenis">${isMasuk ? '📥' : '📤'}</div>
        <div class="r-info">
          <div class="r-ket">${escapeHtml(d.keterangan || '-')}</div>
          <div class="r-meta">
            <span>🏦 ${escapeHtml(d.rekening || 'Tunai')}</span>
            <span>📅 ${d.tanggal || '-'}</span>
          </div>
        </div>
        <div class="r-jumlah">${isMasuk ? '+' : '-'}Rp ${Number(d.jumlah || 0).toLocaleString('id-ID')}</div>
        <button class="btn-hapus-r" title="Pindah ke Arsip">🗑️</button>
      `;
      item.querySelector('.btn-hapus-r').onclick = async () => {
        if (confirm('Pindahkan transaksi ke Arsip?')) {
          await softDelete('transaksi', id, d, d.keterangan || 'Transaksi');
          showToast('🗑️ Dipindahkan ke Arsip!');
          await loadKeuangan();
          listEl.classList.remove('active');
          listEl.innerHTML = '';
          await lihatSemuaKeuangan();
        }
      };
      listContainer.appendChild(item);
    });
  } catch (e) {
    document.getElementById('riwayatList').innerHTML = `<div style="text-align:center;padding:20px;color:#e53e3e;font-size:12px;">❌ ${e.message}</div>`;
  }
};

window.tutupRiwayat = function() {
  const listEl = document.getElementById('listKeuangan');
  listEl.classList.remove('active');
  listEl.innerHTML = '';
};

async function loadKeuangan() {
  const bulan = document.getElementById('filterBulanKeuangan').value;
  if (!bulan) return;
  const [tahun, bln] = bulan.split('-');
  const namaBulan = new Date(tahun, bln - 1).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });

  try {
    const snap = await getDocs(collection(db, 'transaksi'));
    let masuk = 0, keluar = 0;
    const perRekening = {};

    snap.forEach(docSnap => {
      const d = docSnap.data();
      if (!d.tanggal) return;
      if (!d.tanggal.startsWith(bulan)) return;
      
      const rek = d.rekening || 'Tunai';
      
      if (rekeningHidden.includes(rek)) return;
      
      if (!perRekening[rek]) perRekening[rek] = { masuk: 0, keluar: 0 };
      
      if (d.jenis === 'pemasukan') {
        perRekening[rek].masuk += Number(d.jumlah) || 0;
        if (filterRekening === 'semua' || filterRekening === rek) masuk += Number(d.jumlah) || 0;
      } else {
        perRekening[rek].keluar += Number(d.jumlah) || 0;
        if (filterRekening === 'semua' || filterRekening === rek) keluar += Number(d.jumlah) || 0;
      }
    });

    const saldo = masuk - keluar;
    const labelRek = filterRekening === 'semua' ? 'Semua Rekening' : filterRekening;
    
    document.getElementById('saldoBulan').textContent = 'Rp ' + saldo.toLocaleString('id-ID');
    document.getElementById('totalMasukBulan').textContent = 'Rp ' + masuk.toLocaleString('id-ID');
    document.getElementById('totalKeluarBulan').textContent = 'Rp ' + keluar.toLocaleString('id-ID');
    document.getElementById('periodeKeuangan').textContent = `${namaBulan} • ${labelRek}`;

    const max = Math.max(masuk, keluar, 1);
    document.getElementById('barMasuk').style.height = Math.max(6, (masuk/max) * 170) + 'px';
    document.getElementById('barKeluar').style.height = Math.max(6, (keluar/max) * 170) + 'px';
    document.getElementById('labelBarMasuk').textContent = 'Rp ' + masuk.toLocaleString('id-ID');
    document.getElementById('labelBarKeluar').textContent = 'Rp ' + keluar.toLocaleString('id-ID');

    const grid = document.getElementById('ringkasanRekeningGrid');
    const countEl = document.getElementById('totalRekeningCount');
    if (!grid) return;

    const listRekSort = Object.keys(perRekening).sort((a, b) => {
      const sa = perRekening[a].masuk - perRekening[a].keluar;
      const sb = perRekening[b].masuk - perRekening[b].keluar;
      return sb - sa;
    });

    if (countEl) countEl.textContent = `${listRekSort.length} rekening tersedia`;
    const countEl2 = document.getElementById('totalRekeningCount2');
    if (countEl2) countEl2.textContent = `${listRekSort.length} rekening`;

    if (listRekSort.length === 0) {
      grid.innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:30px 20px;background:white;border-radius:14px;box-shadow:var(--shadow);color:var(--text-light);">
          <div style="font-size:40px;margin-bottom:8px;">💳</div>
          <p style="font-size:13px;">Belum ada transaksi bulan ini</p>
        </div>
      `;
      return;
    }

    grid.innerHTML = '';
    listRekSort.forEach(rek => {
      const data = perRekening[rek];
      const sld = data.masuk - data.keluar;
      const style = getRekStyle(rek);
      const isActive = filterRekening === rek;

      const card = document.createElement('div');
      card.className = 'rek-card' + (isActive ? ' is-active' : '');
      card.style.background = style.bg;
      card.style.color = 'white';
      card.style.boxShadow = isActive 
        ? `0 20px 50px ${style.shadow}, 0 0 0 3px rgba(255,255,255,0.3)` 
        : `0 8px 25px ${style.shadow}`;

      card.innerHTML = `
        <button onclick="event.stopPropagation(); hapusRekeningKartu('${rek}')" style="position:absolute;top:10px;right:10px;z-index:5;background:rgba(255,255,255,0.25);border:1px solid rgba(255,255,255,0.4);color:white;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);transition:.3s;" onmouseover="this.style.background='rgba(220,38,38,0.7)'" onmouseout="this.style.background='rgba(255,255,255,0.25)'" title="Hapus rekening">🗑️</button>
        <div style="position:relative;z-index:2;pointer-events:none;">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
            <div style="width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;font-size:20px;backdrop-filter:blur(10px);">
              ${style.icon}
            </div>
            <div style="min-width:0;flex:1;padding-right:36px;">
              <div style="font-size:15px;font-weight:800;letter-spacing:-0.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(rek)}</div>
              <div style="font-size:10px;opacity:0.8;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;">Saldo Rekening</div>
            </div>
          </div>
          <div style="font-size:22px;font-weight:800;margin-bottom:14px;letter-spacing:-0.5px;word-break:break-all;text-shadow:0 2px 8px rgba(0,0,0,0.15);">
            Rp ${sld.toLocaleString('id-ID')}
          </div>
          <div style="display:flex;flex-direction:column;gap:5px;font-size:11.5px;background:rgba(255,255,255,0.15);border-radius:10px;padding:8px 10px;backdrop-filter:blur(10px);">
            <div style="display:flex;justify-content:space-between;">
              <span style="opacity:0.85;">📥 Masuk</span>
              <span style="font-weight:700;">+Rp ${data.masuk.toLocaleString('id-ID')}</span>
            </div>
            <div style="display:flex;justify-content:space-between;">
              <span style="opacity:0.85;">📤 Keluar</span>
              <span style="font-weight:700;">-Rp ${data.keluar.toLocaleString('id-ID')}</span>
            </div>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });

  } catch (e) { console.error(e); }
}

/* ALARM */
let audioCtx = null;
let alarmInterval = null;
let alarmAktif = false;
let audioSiap = false;
const sudahBerbunyi = new Set();

function bukaAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    audioSiap = audioCtx.state === 'running';
    return audioSiap;
  } catch (e) { return false; }
}

document.addEventListener('click', bukaAudio, { once: false });
document.addEventListener('touchstart', bukaAudio, { once: false });

window.aktifkanSuara = function() {
  const ok = bukaAudio();
  if (ok) {
    showToast('🔊 Suara alarm aktif!');
    putarTesSingkat();
    const btn = document.getElementById('btnAudio');
    if (btn) { btn.textContent = '🔊 Suara Aktif ✓'; btn.classList.add('aktif'); }
  } else {
    showToast('⚠️ Coba klik lagi.', 'error');
  }
};

function putarTesSingkat() {
  try {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.setValueAtTime(1100, now + 0.15);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.3, now + 0.02);
    gain.gain.linearRampToValueAtTime(0, now + 0.28);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.3);
  } catch (e) {}
}

function putarAlarm() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    for (let i = 0; i < 8; i++) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(880, now + i * 0.4);
      osc.frequency.setValueAtTime(1200, now + i * 0.4 + 0.2);
      gain.gain.setValueAtTime(0, now + i * 0.4);
      gain.gain.linearRampToValueAtTime(0.5, now + i * 0.4 + 0.02);
      gain.gain.linearRampToValueAtTime(0, now + i * 0.4 + 0.38);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + i * 0.4);
      osc.stop(now + i * 0.4 + 0.4);
    }
  } catch (e) {}
}

function tampilkanAlarm(judul, catatan) {
  document.getElementById('alarmJudul').textContent = judul;
  document.getElementById('alarmCatatan').textContent = catatan || '';
  document.getElementById('alarmModal').classList.add('active');
  alarmAktif = true;
  putarAlarm();
  alarmInterval = setInterval(putarAlarm, 2500);
  if (navigator.vibrate) navigator.vibrate([500, 300, 500, 300, 500]);
  if (Notification.permission === 'granted') {
    try { new Notification('🔔 PENGINGAT: ' + judul, { body: catatan || 'Sudah waktunya!', requireInteraction: true }); } catch (e) {}
  }
}

window.matikanAlarm = function() {
  alarmAktif = false;
  document.getElementById('alarmModal').classList.remove('active');
  if (alarmInterval) { clearInterval(alarmInterval); alarmInterval = null; }
  if (navigator.vibrate) navigator.vibrate(0);
};

async function cekPengingat() {
  if (alarmAktif) return;
  try {
    const snap = await getDocs(collection(db, 'tugas_agenda'));
    const nowTime = Date.now();
    snap.forEach(docSnap => {
      const d = docSnap.data();
      if (d.jenis !== 'pengingat') return;
      if (!d.waktu) return;
      if (sudahBerbunyi.has(docSnap.id)) return;
      const waktuPengingat = new Date(d.waktu);
      const selisihDetik = (nowTime - waktuPengingat.getTime()) / 1000;
      if (selisihDetik >= 0 && selisihDetik <= 90) {
        sudahBerbunyi.add(docSnap.id);
        tampilkanAlarm(d.judul || 'Pengingat', d.catatan);
      }
      if (selisihDetik > 86400) sudahBerbunyi.delete(docSnap.id);
    });
  } catch (e) {}
}

if ('Notification' in window && Notification.permission === 'default') {
  Notification.requestPermission();
}

setInterval(cekPengingat, 5000);
setTimeout(cekPengingat, 2000);

loadRekeningCustom();
</script>
