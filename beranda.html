<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Beranda</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f6fb; min-height: 100vh; }
        
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .header h1 { font-size: 20px; }
        .header .user { display: flex; align-items: center; gap: 15px; }
        .header .avatar {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700;
        }
        .btn-logout {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-logout:hover { background: rgba(255,255,255,0.3); }
        
        .container { padding: 30px; max-width: 1200px; margin: 0 auto; }
        
        .welcome {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            margin-bottom: 30px;
        }
        .welcome h2 { color: #2d3748; font-size: 24px; margin-bottom: 8px; }
        .welcome p { color: #718096; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid transparent;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
            border-color: #667eea;
        }
        .card .icon {
            width: 55px; height: 55px;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px;
            margin-bottom: 15px;
        }
        .card h3 { color: #2d3748; font-size: 16px; margin-bottom: 5px; }
        .card p { color: #a0aec0; font-size: 13px; }
        
        .bg1 { background: linear-gradient(135deg, #e0e7ff, #c7d2fe); }
        .bg2 { background: linear-gradient(135deg, #fbcfe8, #f9a8d4); }
        .bg3 { background: linear-gradient(135deg, #d1fae5, #a7f3d0); }
        .bg4 { background: linear-gradient(135deg, #fed7aa, #fdba74); }
        
        .toast {
            position: fixed;
            top: 30px;
            right: 30px;
            background: white;
            padding: 15px 22px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            font-weight: 600;
            transform: translateX(400px);
            transition: 0.4s;
            border-left: 5px solid #667eea;
            z-index: 9999;
        }
        .toast.show { transform: translateX(0); }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Dashboard</h1>
        <div class="user">
            <span id="userName">User</span>
            <div class="avatar" id="userAvatar">U</div>
            <button class="btn-logout" id="btnLogout">Keluar</button>
        </div>
    </div>

    <div class="container">
        <div class="welcome">
            <h2 id="greeting">Selamat Datang! 🎉</h2>
            <p id="tanggal">Hari ini...</p>
        </div>

        <div class="grid">
            <div class="card" onclick="bukaMenu('Catatan Pribadi')">
                <div class="icon bg1">📝</div>
                <h3>Catatan Pribadi</h3>
                <p>Simpan catatan penting Anda</p>
            </div>
            <div class="card" onclick="bukaMenu('Agenda')">
                <div class="icon bg2">📅</div>
                <h3>Agenda</h3>
                <p>Kelola jadwal kegiatan</p>
            </div>
            <div class="card" onclick="bukaMenu('To-Do List')">
                <div class="icon bg3">✔️</div>
                <h3>To-Do List</h3>
                <p>Daftar tugas harian</p>
            </div>
            <div class="card" onclick="bukaMenu('Keuangan')">
                <div class="icon bg4">💰</div>
                <h3>Keuangan</h3>
                <p>Catat pemasukan & pengeluaran</p>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
        import { cekLogin, logoutUser } from './auth.js';
        
        const toast = document.getElementById('toast');
        
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
        
        // ⭐ Cek apakah user sudah login
        cekLogin((user) => {
            if (!user) {
                alert('Anda harus login dulu!');
                window.location.href = 'index.html';
                return;
            }
            
            const nama = user.email.split('@')[0];
            document.getElementById('userName').textContent = nama;
            document.getElementById('userAvatar').textContent = nama.substring(0,2).toUpperCase();
            
            const jam = new Date().getHours();
            let sapaan = 'Selamat Pagi';
            if (jam >= 11 && jam < 15) sapaan = 'Selamat Siang';
            else if (jam >= 15 && jam < 18) sapaan = 'Selamat Sore';
            else if (jam >= 18) sapaan = 'Selamat Malam';
            
            document.getElementById('greeting').textContent = `${sapaan}, ${nama}! 🎉`;
            
            const opsi = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('tanggal').textContent = new Date().toLocaleDateString('id-ID', opsi);
            
            console.log("✅ User login:", user.email);
        });
        
        // Logout
        document.getElementById('btnLogout').addEventListener('click', async () => {
            if (confirm('Yakin ingin keluar?')) {
                await logoutUser();
                localStorage.clear();
                window.location.href = 'index.html';
            }
        });
        
        // Klik menu
        window.bukaMenu = function(nama) {
            showToast('📂 Membuka: ' + nama);
        };
    </script>
</body>
</html>
